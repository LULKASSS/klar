<style id="stil">
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overscroll-behavior-x: none; }
body { overscroll-behavior-x: none; margin: 0;
  background: var(--leinwand); color: var(--ink);
  font-family: var(--text); font-size: calc(14px * var(--sk)); line-height: 1.55;
  letter-spacing: -.005em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "cv05" 1, "ss03" 1; }
img { max-width: 100%; }
[hidden] { display: none !important; }

:root {
  color-scheme: light;
  /* Palette und Schriften seit 13.09.2026 dieselben wie im Wissensbaum:
     Flieder als einzige Akzentfarbe, Ocker fuer "laeuft", Gold fuer das,
     was als naechstes drankommt. Rot und Gruen bleiben die zwei Signale. */
  --anzeige: "Geist", "IBM Plex Sans", system-ui, sans-serif;
  --marke-schrift: "Geist", "IBM Plex Sans", system-ui, sans-serif;
  --kopf: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --text: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  /* Der Dichtefaktor. Hängt am <html> über data-dichte und wird von
     dichteSetzen() gesetzt; alle Schriftgrößen und die Kernmaße rechnen
     damit. Lukas am 11.09.2026: "ich bin immer ein klein wenig zu weit
     reingezoomt, sowohl mit dem Handy als auch mit dem Laptop". */
  --sk: 0.93;
  --pad: calc(14px * var(--sk));
  --zeile: calc(37px * var(--sk)); --rand: calc(9px * var(--sk));
  --leinwand: #f0f0f2;
  --panel: #ffffff;
  --panel2: #f3f3f6;
  --ink: #17171b;
  --ink2: #54545c;
  --grau: #6b6b74;
  --linie: #e5e5ea;
  --linie2: #eeeef2;
  --akzent: #6a52a3;
  --akzent-hell: #8069c2;
  --akzent-weich: #efecf8;
  --akzent-text: #ffffff;
  --rot: #b4382b;
  --rot-weich: #fae9e6;
  --gruen: #2c6f4d;
  --gruen-weich: #e5efe9;
  --gold: #8a6717;
  --glas: rgba(255,255,255,.86);
  --rand-linie: rgba(18,18,24,.07);
  --schatten: 0 10px 26px -14px rgba(18,18,28,.26), 0 2px 5px -2px rgba(18,18,28,.06);
  --r: 16px;
  /* Bewegung (23.09.2026, klar-ui): eine Kurve für fast alles, eine für
     Blätter von unten. Keine Federn, kein Überschwingen. */
  --ease-aus: cubic-bezier(.23, 1, .32, 1);
  --ease-schublade: cubic-bezier(.32, .72, 0, 1);
  --t-kurz: 120ms; --t-mittel: 200ms; --t-lang: 280ms;
  /* Stärke des Prioritäts-Schleiers; im Dunkeln leiser, sonst wird er schlammig. */
  --wash: 1;
  /* ---- "In Arbeit" wieder in sanftem Orange ---- */
  --ocker: #985210; --ocker-weich: #fbeddd;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --leinwand: #141416; --panel: #1c1c20; --panel2: #25252a;
    --ink: #ededf1; --ink2: #a6a6ae; --grau: #8e8e97;
    --linie: #2f2f35; --linie2: #26262b;
    --akzent: #a48ddb; --akzent-hell: #b8a4e6; --akzent-weich: #2a2540; --akzent-text: #14141a;
    --rot: #ef7d6e; --rot-weich: #34211f;
    --gruen: #63c191; --gruen-weich: #1b2c23;
    --gold: #cfa54f;
    --glas: rgba(28,28,32,.86); --rand-linie: rgba(255,255,255,.08);
    --schatten: 0 12px 28px -16px rgba(0,0,0,.7); --ocker: #e0a469; --ocker-weich: #33281c;
    --wash: .7;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --leinwand: #141416; --panel: #1c1c20; --panel2: #25252a;
  --ink: #ededf1; --ink2: #a6a6ae; --grau: #8e8e97;
  --linie: #2f2f35; --linie2: #26262b;
  --akzent: #a48ddb; --akzent-hell: #b8a4e6; --akzent-weich: #2a2540; --akzent-text: #14141a;
  --rot: #ef7d6e; --rot-weich: #34211f;
  --gruen: #63c191; --gruen-weich: #1b2c23;
  --gold: #cfa54f;
  --glas: rgba(28,28,32,.86); --rand-linie: rgba(255,255,255,.08);
  --schatten: 0 12px 28px -16px rgba(0,0,0,.7); --ocker: #e0a469; --ocker-weich: #33281c;
    --wash: .7;
}
button { cursor: pointer; font-family: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--akzent); outline-offset: 1px;
  outline-color: var(--akzent-hell);
}

.app {
  display: flex; flex-direction: column; gap: 0; margin: 0 auto; padding: 0 var(--rand) 64px;
  /* Und die Seite selbst darf breiter werden — 880px liessen auf dem Rechner
   einen Streifen stehen, der nichts getan hat. */
  max-width: 1120px; padding-bottom: 108px;
}

/* ================= Kopf ================= */
.kopf {
  position: sticky; top: 0; z-index: 20; margin-bottom: 4px; border-bottom: none;
}
html[data-himmel] .kopf, html[data-himmel] #inhalt, html[data-himmel] #fab { display: none !important; }
.kopf-oben { display: flex; align-items: center; padding-bottom: 6px; padding: 9px 0 5px; gap: 8px; }
/* Das Logo ist gleichzeitig der Weg zurück auf die Aufgabenliste. */
.marke {
  display: flex; align-items: center; flex-shrink: 0;
  color: var(--ink); background: none; border: none; margin-right: 2px; padding: 0 10px 0 6px !important; cursor: pointer;
  gap: 8px; height: 36px; margin-left: -6px;
  transition: background .15s ease; font-size: calc(15px * var(--sk)); padding: 3px 6px 3px 0;
}
.marke .zeichen { color: var(--akzent); flex-shrink: 0; }
.marke .ort:empty { display: none; }
.marke[aria-expanded="true"] .pfeilchen { transform: rotate(180deg); }
.marke .ort::before { content: ""; position: absolute; left: 0; top: 18%; bottom: 18%; width: 1px; background: var(--linie); }

.segmente { display: flex; gap: 2px; }
.segmente button {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--kopf); color: var(--grau);
  background: none; border: none;
}
.segmente .zahl { font-size: calc(12px * var(--sk)); opacity: .7; font-variant-numeric: tabular-nums; }

.suchfach { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; border: 1px solid transparent; height: 30px; padding: 0 11px; }
.suchfach:focus-within { background: var(--panel); border-color: var(--akzent); }
.suchfach svg { flex-shrink: 0; color: var(--grau); }
.suchfach input {
  flex: 1 1 auto; min-width: 0; height: 100%;
  font-family: inherit; color: var(--ink); background: none; border: none; padding: 0;
}
.suchfach input::placeholder { color: var(--grau); }
.suchfach input:focus { outline: none; }

/* Der Stand wird nicht mehr im Hintergrund veröffentlicht (das lud die Seite
   neu und warf Lukas mitten in der Arbeit zurück). Stattdessen dieser Knopf:
   er ist nur da, wenn etwas ungesichert ist. */
.sicherknopf {
  display: flex; align-items: center; gap: 7px; flex-shrink: 0;
  font-family: var(--kopf); font-size: calc(12.5px * var(--sk)); font-weight: 500; color: var(--ink2); border: 1px solid var(--linie); height: 28px; padding: 4px 9px;
}
.sicherknopf .pkt { width: 6px; height: 6px; border-radius: 50%; background: var(--akzent); flex-shrink: 0; }
.sicherknopf[data-laeuft="ja"] { color: var(--grau); }
.sicherknopf[data-laeuft="ja"] .pkt { background: var(--grau); }
@media (prefers-reduced-motion: no-preference) {
  .sicherknopf .pkt { animation: wach 2.6s ease-in-out infinite; }
  @keyframes wach { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
}
.kopf-oben .rechts { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.rundknopf { padding: 0; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; border: 1px solid var(--linie); color: var(--ink2); width: 30px; height: 30px;
}
.neuknopf { align-items: center; gap: 7px; flex-shrink: 0;
  font-family: var(--kopf); border: 1px solid var(--akzent); padding: 6px 12px; font-size: calc(12.5px * var(--sk)); display: none;
}
.neuknopf .kurz { display: none; }

.kopf-filter {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 0 0 10px; font-size: calc(12.5px * var(--sk)); color: var(--grau);
}
.kopf-filter .stand { font-variant-numeric: tabular-nums; }
.kopf-filter .werkzeuge { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.wahlfeld {
  font-family: inherit; font-size: calc(12.5px * var(--sk)); color: var(--ink2); border: 1px solid var(--linie);
  padding: 4px 6px; max-width: 100%;
}
.wahlfeld:focus { outline: none; border-color: var(--akzent); }
.schalter {
  font-family: inherit; font-size: calc(12.5px * var(--sk)); color: var(--grau);
  background: none; border: 1px solid var(--linie); padding: 4px 12px;
}
.schalter[aria-pressed="true"] { font-weight: 600; }

/* ================= Menü ================= */
.menuschicht { position: fixed; inset: 0; z-index: 40; background: transparent; border: none; }
.menu {
  position: absolute; z-index: 41; min-width: 248px; border: 1px solid var(--linie); padding: 5px;
  display: flex; flex-direction: column; gap: 1px;
}
.menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  font-size: calc(14px * var(--sk)); color: var(--ink2); background: none; border: none; padding: 9px 11px;
}
.menu .trenner { height: 1px; background: var(--linie2); margin: 4px 6px; }
.themawahl { display: flex; gap: 2px; padding: 3px 6px 5px; }
.themawahl button {
  flex: 1; justify-content: center; padding: 6px 4px !important;
  font-size: calc(12.5px * var(--sk)); border: 1px solid var(--linie) !important;
  color: var(--grau);
}
.themawahl button[aria-pressed="true"] { border-color: var(--akzent) !important; color: var(--akzent); background: var(--akzent-weich); }

/* ================= Gruppen ================= */
.gruppen { display: flex; flex-direction: column; gap: 0; }
.gruppe { display: flex; flex-direction: column; gap: 0; }
.gruppe-kopf {
  display: flex; align-items: center; gap: 9px;
  position: sticky; top: calc(var(--kopfhoehe, 84px) + var(--leistehoehe, 0px)); z-index: 5; border-top: 1px solid var(--linie); border-bottom: 1px solid var(--linie2); border: none; height: auto;
  margin: 0; background: none;
}
.gruppe:first-child .gruppe-kopf { margin-top: 6px; padding-top: 4px; }
.gruppe-kopf .marker { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: var(--grau); opacity: .5; }
.gruppe-kopf .marker[data-p="1"] { background: var(--rot); }
.gruppe-kopf .marker[data-eilig="ja"] { background: var(--rot); }
.gruppe-kopf .marker[data-s="durchdacht"], .gruppe-kopf .marker[data-s="entwurf"] { background: var(--akzent); }
.gruppe-kopf .marker[data-s="freigegeben"] { background: var(--gruen); }
.gruppe-kopf .marker[data-s="neu"] { background: var(--grau); opacity: .8; }
.gruppe-kopf .anzahl { margin-left: auto; font-variant-numeric: tabular-nums; }

/* Keine Karten mehr: die Liste läuft durch, getrennt nur von Haarlinien.
   Das ist der eigentliche Unterschied zum alten Aussehen — nicht die Farbe. */
.tafel { box-shadow: none; }
.leer { padding: 44px var(--pad); text-align: center; color: var(--grau); font-size: calc(14px * var(--sk)); }

/* ================= Aufgabenzeile ================= */
.zeile {
  position: relative; display: flex; flex-direction: column;
  border-bottom: 1px solid var(--linie2); touch-action: pan-y; box-shadow: none; overflow: hidden;
}
.tafel .zeile:last-child { border-bottom: none; border-bottom-width: 1px; border-bottom-style: solid; }
.zeile[data-prio="1"] { box-shadow: none; }
.zeile[data-prio="1"][data-erledigt="ja"] { box-shadow: inset 2px 0 0 color-mix(in srgb, var(--rot) 35%, transparent); border-color: var(--linie); }
.z-kopf {
  display: flex; align-items: center; padding: 0 calc(var(--rand) + var(--pad));
  -webkit-tap-highlight-color: transparent;
}

.haken { flex-shrink: 0; padding: 0;
  border: 1.5px solid var(--linie); background: var(--panel);
  display: flex; align-items: center; justify-content: center;
  transition: border-color .12s ease, background .12s ease;
}
.haken svg { opacity: 0; color: var(--gruen); }
[data-erledigt="ja"] > .z-kopf > .haken, .punkte li[data-ok="ja"] .haken { background: var(--gruen-weich); border-color: var(--gruen); }
[data-erledigt="ja"] > .z-kopf > .haken svg, .punkte li[data-ok="ja"] .haken svg { opacity: 1; }

/* Die Priorität steht schon in der Gruppenüberschrift. In der Zeile reicht
   ein Punkt — nur "Hoch" soll auffallen, und der ruht nicht ganz still. */
.prio {
  flex-shrink: 0; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none;
}
@media (prefers-reduced-motion: no-preference) {
  @keyframes atmen {
    0%, 62%, 100% { transform: scale(.7); opacity: 0; }
    28% { transform: scale(1.4); opacity: .45; }
  }
}

.titel {
  flex: 1 1 auto; min-width: 60px;
  font-family: inherit; font-weight: 500; line-height: 1.35; color: var(--ink);
  background: none; border: 1px solid transparent; margin-left: -6px;
  overflow: hidden; text-overflow: ellipsis;
}
span.titel {
  cursor: pointer; display: block; white-space: nowrap;
  -webkit-user-select: none; user-select: none;
}
input.titel { cursor: text; }
input.titel:focus { outline: none; border-color: var(--akzent); background: var(--panel); }
[data-erledigt="ja"] .titel { text-decoration: line-through;
  text-decoration-color: color-mix(in srgb, var(--gruen) 55%, transparent);
  text-decoration-thickness: 1px; }

.z-meta { flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
.mk-wdh { font-size: calc(12px * var(--sk)); line-height: 1; color: var(--grau); }
.mk-punkte { color: var(--grau); font-variant-numeric: tabular-nums; font-size: calc(11px * var(--sk)); }
.mk-punkte[data-laeuft="ja"] { font-weight: 600; color: var(--ocker); }
.mk-punkte[data-fertig="ja"] { color: var(--gruen); font-weight: 600; }
#dpunkte li .weg { opacity: .55; }
.mk-cluster {
  color: var(--grau); background: none; border: 1px solid transparent;
  padding: 2px 4px; border-radius: 4px; white-space: nowrap;
  width: 68px; text-align: right; flex-shrink: 0;
  overflow: hidden; text-overflow: ellipsis;
}
/* Ohne Cluster steht in der Zeile ein blasses ＋ statt einer Lücke — ein Klick
   setzt den Cluster, ohne dass das Blatt aufgemacht werden muss. */
button.mk-cluster { line-height: 1.5; }
button.mk-cluster[data-leer="ja"] { opacity: .35; font-size: calc(12px * var(--sk)); }
button.mk-cluster[data-leer="ja"]:focus-visible { opacity: 1; }
.datumknopf { text-align: right; flex-shrink: 0;
  font-family: inherit; color: var(--grau); font-variant-numeric: tabular-nums;
  background: none; border: none; padding: 4px 0; white-space: nowrap; font-size: calc(11.5px * var(--sk)); width: 52px;
}
.datumknopf.leer { opacity: 0; }
.datumknopf.leer:focus-visible { opacity: .55; }
.datumknopf[data-eilig="ja"] { color: var(--rot); font-weight: 600; opacity: 1; }
/* Kritisch heisst: in hoechstens drei Tagen faellig. Gedaempftes Rot, damit
   das echte Ueberfaellig darueber noch lauter ist. */
.datumknopf[data-frist="ueberfaellig"] { color: var(--rot); font-weight: 700; opacity: 1; }
.datumknopf[data-frist="kritisch"] { color: color-mix(in srgb, var(--rot) 52%, var(--ink2)); font-weight: 600; opacity: 1; }

/* ================= Ideenzeile ================= */
.izeile {
  width: 100%; display: flex; gap: 12px; align-items: center; background: none; border: none; border-bottom: 1px solid var(--linie2);
  text-align: left; color: inherit; font: inherit;
}
.tafel .izeile:last-child { border-bottom: none; }
.izeile .text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.izeile .t1 {
  font-family: var(--kopf); font-weight: 600; font-size: calc(14.5px * var(--sk)); line-height: 1.35; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.izeile .t2 { font-size: calc(12.5px * var(--sk)); color: var(--grau); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.izeile .bereich {
  flex-shrink: 0; color: var(--ink2);
  background: var(--panel2); border: 1px solid var(--linie);
}

/* ================= Blatt (Aufgabe im Detail) ================= */
.blatt, .detail, .kasten {
  background: var(--panel); border: 1px solid var(--linie);
}
.balken {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-bottom: 1px solid var(--linie); padding: 6px 12px;
}
.zurueck { font-size: calc(13px * var(--sk)); color: var(--ink2); background: none; border: none; padding: 5px 8px; display: flex; gap: 7px; align-items: center; }
.lage { background: var(--panel2); color: var(--grau);
}
.balken .werkzeuge { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.koerper { display: flex; flex-direction: column; padding: 15px 16px 16px; gap: 14px; }
.b-titel {
  width: 100%; resize: none; font-family: var(--kopf); font-weight: 600;
  letter-spacing: -.015em; line-height: 1.3; color: var(--ink);
  background: none; border: 1px solid transparent; margin-left: -8px;
}
.b-titel:focus { outline: none; border-color: var(--akzent); background: var(--panel2); }
.raster { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); align-items: start; gap: 13px; }
.feld { display: flex; flex-direction: column; min-width: 0; gap: 5px; }
.feld > .name .zaehler { margin-left: 8px; color: var(--grau); font-variant-numeric: tabular-nums; font-family: var(--text); letter-spacing: 0; }
.feld > .name .zaehler[data-fertig="ja"] { color: var(--gruen); }
.feld p { margin: 0; color: var(--ink2); }
.feld .hinweis { font-size: calc(12.5px * var(--sk)); color: var(--grau); }
.feld .hinweis[data-eilig="ja"] { color: var(--rot); font-weight: 600; }

select.eingabe, .eingabe {
  font-family: inherit; color: var(--ink); border: 1px solid var(--linie); width: 100%; min-width: 0;
}
select.eingabe:focus, .eingabe:focus { outline: none; }
.prio-wahl { display: flex; gap: 5px; }
.prio-wahl button {
  flex: 1; font-family: var(--kopf); letter-spacing: 0;
  border: 1px solid var(--linie); background: var(--panel2); color: var(--ink2);
}

.datumfeld {
  display: inline-flex; align-items: center; gap: 8px; text-align: left;
  font-family: inherit; color: var(--ink); font-variant-numeric: tabular-nums; border: 1px solid var(--linie); width: 100%;
}
.datumfeld[data-leer="ja"] { color: var(--grau); }
.datumfeld[data-eilig="ja"] { color: var(--rot); font-weight: 600; }
.datumfeld .pfeil { margin-left: auto; color: var(--grau); font-size: calc(11px * var(--sk)); }

.notizfeld {
  width: 100%; resize: vertical;
  font-family: inherit; line-height: 1.6; color: var(--ink); border: 1px solid var(--linie);
}
.notizfeld:focus { outline: none; }

/* Die Unterpunkte sind ein eigener Bereich, kein loser Anhang: eigene Fläche,
   Rahmen drumherum, Trennlinien dazwischen. Vorher (09.09.) hat Lukas nicht
   gesehen, wo der Block anfängt und aufhört. */
.punkte {
  list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px;
}
/* 23.09.2026: Jeder Unterpunkt ist eine eigene Karte mit Abstand zur naechsten.
   Mit langen Notizen verschwamm vorher, wo der naechste Punkt anfaengt. */
.punkte li {
  display: flex; flex-direction: column; background: var(--panel2); border-radius: 14px;
  border: 1px solid transparent;
}
.punkte li.neupunkt { flex-direction: row; align-items: center; gap: 11px; background: transparent; padding-left: 10px; }
.punkte li[data-ok="ja"] { background: transparent; border-color: var(--linie); }
.p-kopf { display: flex; align-items: center; gap: 11px; min-height: 28px; }

/* Ein Unterpunkt hat drei Zustände: offen, läuft, fertig. Der Haken wechselt
   durch alle drei — Ocker steht für „angefangen“. */
.punkte li[data-st="laeuft"] .haken svg { display: none; }
.punkte li[data-st="laeuft"] .haken::after {
  content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ocker);
}
.punkt-feld {
  flex: 1 1 auto; min-width: 0;
  font-family: inherit; line-height: 1.45; color: var(--ink);
  background: none; border: 1px solid transparent; padding: 4px 6px;
}
.punkt-feld:focus { outline: none; border-color: var(--akzent); background: var(--panel); }
.punkte li[data-ok="ja"] .punkt-feld {
  text-decoration: line-through;
  text-decoration-color: color-mix(in srgb, var(--gruen) 62%, transparent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0; font-weight: 400; }
.punkte li.neupunkt .platz { width: 17px; flex-shrink: 0; }
.punkt-feld::placeholder { color: var(--grau); opacity: .75; }
.punkte li .weg { opacity: 0; }
.punkte li .weg:focus-visible { opacity: 1; }
.punkte li[data-st="fertig"] .p-ast.loesung .marke-k { color: var(--gruen); }
.punkte li[data-st="fertig"] .p-ast.loesung textarea { color: var(--ink); }
.punkte li[data-ok="ja"] .punkt-feld:focus {
  color: var(--ink); text-decoration-color: color-mix(in srgb, var(--gruen) 40%, transparent);
}
.fuss { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.fuss .weg { margin-left: auto; }
.spur { font-size: calc(12.5px * var(--sk)); color: var(--grau); margin: 0; }

.knopf {
  font-family: var(--kopf); border: 1px solid var(--akzent);
}
.knopf-leise {
  font-family: var(--kopf); color: var(--ink); border: 1px solid var(--linie); font-weight: 450;
}
.knopf-klein { font-size: calc(13px * var(--sk)); color: var(--grau); background: none; border: none; padding: 6px 4px; }

/* ================= Verlauf einer Aufgabe =================
   Was schon passiert ist, chronologisch. Getrennt von den Unterpunkten:
   die sagen, was noch zu tun ist. Beides in einem Topf macht den Zähler
   unbrauchbar und die Checkliste unlesbar. */
.verlauf { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.verlauf li { display: flex; gap: 12px; align-items: flex-start; }
.verlauf .bahn { display: flex; flex-direction: column; align-items: center; align-self: stretch; flex-shrink: 0; width: 9px; padding-top: 7px; }
.verlauf .knoten { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.verlauf .strich { width: 1px; flex-grow: 1; background: var(--linie); min-height: 10px; margin-top: 3px; }
.verlauf li:last-child .strich { background: transparent; }
.verlauf .inhalt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-bottom: 11px; }
.verlauf .oben { display: flex; align-items: center; gap: 8px; }
.verlauf .wann { font-size: calc(11.5px * var(--sk)); color: var(--grau); font-variant-numeric: tabular-nums; }
.verlauf .weg { opacity: 0; margin-left: auto; }
/* Was die Seite selbst mitschreibt, steht leiser da als das, was Lukas tippt. */
.verlauf li[data-art="auto"] .knoten { background: var(--linie); width: 6px; height: 6px; }
.verlauf li[data-art="auto"] .v-fest { font-size: calc(13.5px * var(--sk)); color: var(--grau); }
.v-fest { display: block; padding: 3px 0; line-height: 1.55; white-space: pre-wrap; }
.v-mehr {
  align-self: flex-start; font-size: calc(12.5px * var(--sk)); color: var(--ink2);
  background: none; border: none; padding: 2px 0 8px; display: flex; align-items: center; gap: 7px;
}
.v-mehr .pfeil { font-size: calc(10px * var(--sk)); color: var(--grau); }
.verlauf li:hover .weg, .verlauf .weg:focus-visible { opacity: 1; }
.v-text {
  width: 100%; resize: none; overflow: hidden; display: block;
  font-family: inherit; line-height: 1.55; color: var(--ink);
  background: none; border: 1px solid transparent;
  padding: 3px 6px; margin-left: -6px;
}
.v-text:focus { outline: none; border-color: var(--akzent); background: var(--panel); }
.verlauf-neu { display: flex; gap: 9px; align-items: flex-start; }
.verlauf-neu textarea {
  flex: 1 1 auto; min-width: 0; min-height: 62px; resize: vertical;
  font-family: inherit; font-size: calc(14.5px * var(--sk)); line-height: 1.55; color: var(--ink); border: 1px solid var(--linie); padding: 9px 11px;
}
.verlauf-neu textarea:focus { outline: none; }
.verlauf-fuss { display: flex; align-items: center; gap: 10px; }

/* ================= Ideen-Detail ================= */
.zitat {
  margin: 0; padding: 13px 15px; background: var(--panel2);
  border: 1px solid var(--linie2); color: var(--ink2); white-space: pre-wrap; font-size: calc(14.5px * var(--sk));
}
.fazit {
  margin: 0; padding: 15px 17px;
  background: var(--akzent-weich); border: 1px solid color-mix(in srgb, var(--akzent) 26%, transparent);
  font-family: var(--kopf); font-weight: 600; font-size: calc(17px * var(--sk)); line-height: 1.45; color: var(--ink);
}
[data-status="freigegeben"] .fazit, [data-status="entwurf"] .fazit { background: var(--gruen-weich); border-color: color-mix(in srgb, var(--gruen) 26%, transparent); }
.plan { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.plan li { display: flex; gap: 13px; align-items: flex-start; }
.plan .bahn { display: flex; flex-direction: column; align-items: center; align-self: stretch; flex-shrink: 0; }
.plan .nr {
  width: 24px; height: 24px; flex-shrink: 0;
  background: var(--akzent-weich); color: var(--akzent);
  display: flex; align-items: center; justify-content: center; font-size: calc(11.5px * var(--sk)); font-variant-numeric: tabular-nums; font-family: var(--marke-schrift); font-weight: 500;
}
.plan .strich { width: 2px; flex-grow: 1; background: var(--linie2); min-height: 8px; }
.plan li:last-child .strich { background: transparent; }
.plan .was { padding: 2px 0 16px; color: var(--ink); }
.plan li:last-child .was { padding-bottom: 0; }
.ziel { border: 1px solid var(--linie); padding: 16px 18px; display: flex; flex-direction: column; gap: 7px; background: var(--panel2); }
.ziel .name { color: var(--akzent); }
.entwurfkasten {
  border: 1px solid var(--gruen); background: var(--gruen-weich);
  padding: 16px 18px; display: flex; flex-direction: column; gap: 11px;
}
.entwurfkasten a {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--kopf); font-size: calc(13.5px * var(--sk)); font-weight: 600; padding: 9px 15px; text-decoration: none;
}
.antwort { margin: 0; padding: 13px 15px; background: var(--akzent-weich); color: var(--ink2); font-size: calc(14.5px * var(--sk)); }
.antwort strong { color: var(--akzent); }
.rueckfrage { border: 1px solid var(--akzent); background: var(--panel); display: flex; flex-direction: column; gap: 10px; padding: 14px var(--pad); }
.rueckfrage p { margin: 0; font-size: calc(13.5px * var(--sk)); color: var(--grau); }
.feldzeile { display: flex; gap: 10px; align-items: flex-start; }
.feldzeile textarea { min-height: 70px; }

/* ================= Mikrofon ================= */
.mikro {
  flex-shrink: 0; width: 38px; height: 38px;
  background: transparent; border: 1px solid var(--linie); color: var(--grau);
  display: flex; align-items: center; justify-content: center;
  transition: color .12s ease, border-color .12s ease, background .12s ease; border-color: var(--rand-linie);
}
.mikro[data-an="ja"] { color: var(--akzent-text); background: var(--akzent); border-color: var(--akzent); }
@media (prefers-reduced-motion: no-preference) {
  .mikro[data-an="ja"] { animation: puls 1.5s ease-in-out infinite; }
  @keyframes puls { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--akzent) 34%, transparent); } 50% { box-shadow: 0 0 0 7px transparent; } }
}

/* ================= Dialog ================= */
.dialogschicht {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(10,9,16,.48);
}
.dialog {
  width: 100%; max-width: 440px; max-height: 100%;
  background: var(--panel); border: 1px solid var(--linie);
  display: flex; flex-direction: column; overflow: hidden;
}
.dialog-kopf {
  display: flex; align-items: center; gap: 10px; padding: 12px var(--pad);
  border-bottom: 1px solid var(--linie2);
}
.dialog-kopf .zu {
  margin-left: auto; width: 28px; height: 28px; padding: 0; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 1px solid transparent; color: var(--grau); font-size: calc(17px * var(--sk)); line-height: 1;
}
.dialog-koerper { display: flex; flex-direction: column; overflow-y: auto; padding: 12px; gap: 12px; }
.dialog-fuss {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 11px var(--pad);
  border-top: 1px solid var(--linie2);
}
.dialog-fuss .knopf { margin-left: auto; }
.dialog-fuss .taste { font-size: calc(12px * var(--sk)); color: var(--grau); }
.d-titel {
  width: 100%; min-height: 56px; resize: none;
  font-family: inherit; font-size: calc(15.5px * var(--sk)); line-height: 1.45; color: var(--ink); border: 1px solid var(--linie); padding: 10px 12px;
}
.d-titel:focus { outline: none; }
.d-notiz { min-height: 66px; }
.zweispalt { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ================= Kalender ================= */
.kalenderschicht { position: fixed; inset: 0; z-index: 70; background: transparent; border: none; }
.kalenderkasten {
  position: fixed; z-index: 71; width: 268px; border: 1px solid var(--linie);
  padding: 10px; display: flex; flex-direction: column; gap: 8px;
}
.kal-schnell { display: flex; gap: 5px; }
.kal-schnell button {
  flex: 1; font-size: calc(12px * var(--sk)); padding: 6px 4px;
  border: 1px solid var(--linie); background: var(--panel2); color: var(--ink2);
}
.kal-kopf { display: flex; align-items: center; gap: 6px; }
.kal-kopf .kal-titel { flex: 1; text-align: center; font-family: var(--kopf); font-weight: 600; font-size: calc(13px * var(--sk)); }
.kal-kopf button {
  width: 28px; height: 28px; padding: 0; border-radius: 5px;
  border: 1px solid transparent; background: none; color: var(--ink2); font-size: calc(15px * var(--sk)); line-height: 1;
}
.kal-wochentage, .kal-gitter { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.kal-wochentage span {
  text-align: center; color: var(--grau); padding-bottom: 2px;
}
.kal-tag {
  height: 31px; padding: 0; border: 1px solid transparent; background: none;
  font-family: inherit; font-size: calc(12.5px * var(--sk)); color: var(--ink); font-variant-numeric: tabular-nums;
}
.kal-tag[data-fremd="ja"] { color: var(--grau); opacity: .5; }
.kal-tag[data-heute="ja"] { border-color: var(--rot); color: var(--rot); font-weight: 700; }
.kal-tag[data-gewaehlt="ja"] { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-text); font-weight: 700; }
.kal-fuss { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--linie2); padding-top: 8px; }
.kal-fuss button { font-size: calc(12px * var(--sk)); padding: 5px 10px; border: 1px solid var(--linie); background: var(--panel); color: var(--ink2); }
.kal-fuss .kal-info { margin-left: auto; font-size: calc(11.5px * var(--sk)); color: var(--grau); }
.kal-fuss .kal-info[data-eilig="ja"] { color: var(--rot); font-weight: 600; }

/* ================= Cluster-Auswahl aus der Zeile ================= */
.clusterschicht { position: fixed; inset: 0; z-index: 70; background: transparent; border: none; }
.clusterpop {
  position: fixed; z-index: 71; width: 196px; max-height: 60vh; overflow-y: auto; border: 1px solid var(--linie);
  padding: 5px; display: flex; flex-direction: column; gap: 1px;
}
.clusterpop button {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  font-size: calc(14px * var(--sk)); color: var(--ink2); background: none; border: none; padding: 8px 10px;
}
.clusterpop button[aria-pressed="true"] { background: var(--akzent-weich); color: var(--akzent); font-weight: 600; }
.clusterpop button .zeichen { width: 12px; flex-shrink: 0; color: var(--akzent); }
.clusterpop .trenner { height: 1px; background: var(--linie2); margin: 4px 6px; }
.clusterpop .leiser { color: var(--grau); font-size: calc(13px * var(--sk)); }

/* ================= Hinweis, Brücke, Cluster, Lagebericht ================= */
.hinweiszeile { border-left: 3px solid var(--akzent); padding: 10px 14px; font-size: calc(14px * var(--sk)); color: var(--ink2);
  /* Rückgängig direkt im Hinweis — abhaken soll nie endgültig wirken. */
  display: flex; align-items: center; gap: 12px;
  /* Der Hinweisstreifen: der dicke linke Balken sah im runden Rahmen aus wie
   eine Sichel. Jetzt traegt ihn die Randfarbe. */
  border: 1px solid color-mix(in srgb, var(--akzent) 38%, var(--linie));
  border-left-width: 1px; background: var(--panel);
}
.hinweiszeile[data-art="fehler"] { border-left-color: var(--rot); color: var(--rot);
  border-color: color-mix(in srgb, var(--rot) 42%, var(--linie)); background: var(--rot-weich); }
.kasten .fach { padding: 15px var(--pad); border-top: 1px solid var(--linie2); display: flex; flex-direction: column; gap: 10px; }
.kasten .fach:first-of-type { border-top: none; }
.kasten .fach p { margin: 0; font-size: calc(13.5px * var(--sk)); color: var(--grau); }
.kasten textarea.roh {
  width: 100%; min-height: 92px; resize: vertical;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: calc(12px * var(--sk)); line-height: 1.5;
  color: var(--ink); border: 1px solid var(--linie); padding: 10px 11px;
}
.kasten textarea.roh:focus { outline: none; border-color: var(--akzent); }
.knopfzeile { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.clusterliste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.clusterliste li { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.clusterliste .wieviel { font-size: calc(12.5px * var(--sk)); color: var(--grau); font-variant-numeric: tabular-nums; }
.clusterliste .sicher { font-size: calc(13px * var(--sk)); color: var(--rot); font-weight: 600; margin-left: auto; }
.clusterliste li > .knopf-klein { margin-left: auto; }
.clusterliste .sicher ~ .knopf-klein { margin-left: 0; }
.breit { flex: 1 1 auto; min-width: 150px; width: auto; }

.lage-kopf h2 { font-size: calc(22px * var(--sk)); margin: 0 0 2px; }
.tafel.wartet { border-left: 3px solid var(--akzent); }
.lage-zeile { display: flex; gap: 12px; align-items: flex-start; padding: 11px var(--pad); border-top: 1px solid var(--linie2); }
.tafel .lage-zeile:first-child { border-top: none; }
.lage-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; color: var(--ink); }
.lage-text .unter { font-size: calc(13px * var(--sk)); color: var(--grau); }
.lage[data-z="läuft"] { color: var(--gruen); background: var(--gruen-weich); }
.lage-karten { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.lage-karte {
  background: var(--panel); border: 1px solid var(--linie); padding: 13px 15px; display: flex; flex-direction: column; gap: 6px;
}
.lage-karte p { margin: 0; font-size: calc(13.5px * var(--sk)); color: var(--ink2); line-height: 1.5; }
.lage-karte p.still { color: var(--grau); font-style: italic; }
.chronik-tag { padding: 12px var(--pad); border-top: 1px solid var(--linie2); }
.tafel .chronik-tag:first-child { border-top: none; }
.chronik-tag .tagname { font-family: var(--kopf); font-size: calc(11.5px * var(--sk)); font-weight: 600; letter-spacing: .04em; color: var(--grau); }
.chronik-tag ul { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.chronik-tag li { font-size: calc(13.5px * var(--sk)); color: var(--ink2); line-height: 1.5; }
.suchspur { font-size: calc(12.5px * var(--sk)); color: var(--grau); padding: 0 4px; }

/* ================= Lernen ================= */
.loesung-warum { font-size: calc(13.5px * var(--sk)); color: var(--grau); margin: 0; }
.loesung-feld { min-height: 130px; }
.ablauf { padding: 15px var(--pad); border-top: 1px solid var(--linie2); display: flex; flex-direction: column; gap: 9px; }
.tafel .ablauf:first-child { border-top: none; }
.ablauf-kopf { display: flex; flex-wrap: wrap; align-items: baseline; gap: 9px; }
.ablauf-kopf .name { font-family: var(--kopf); font-weight: 600; font-size: calc(15px * var(--sk)); color: var(--ink); }
.ablauf-kopf .wie-oft { font-size: calc(12px * var(--sk)); color: var(--grau); font-variant-numeric: tabular-nums; }
.ablauf-kopf .werkzeuge { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.ablauf .wann { font-size: calc(13.5px * var(--sk)); color: var(--ink2); margin: 0; }
.ablauf ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.ablauf li { font-size: calc(14px * var(--sk)); color: var(--ink); line-height: 1.5; }
.ablauf .merke { margin: 0; font-size: calc(13px * var(--sk)); color: var(--grau); }
.skillmarke { background: var(--gruen-weich); color: var(--gruen); border: 1px solid color-mix(in srgb, var(--gruen) 30%, transparent);
}
.skillmarke[data-stand="vorgeschlagen"] { background: var(--akzent-weich); color: var(--akzent); border-color: color-mix(in srgb, var(--akzent) 30%, transparent); }
.eingangzeile { padding: 12px var(--pad); border-top: 1px solid var(--linie2); display: flex; flex-direction: column; gap: 4px; }
.tafel .eingangzeile:first-child { border-top: none; }
.eingangzeile .oben { display: flex; gap: 9px; align-items: baseline; }
.eingangzeile .mk-cluster { width: auto; text-align: left; border-color: var(--linie); background: var(--panel2); padding: 1px 6px; }
.eingangzeile .was { font-family: var(--kopf); font-weight: 600; font-size: calc(13.5px * var(--sk)); color: var(--ink); }
.eingangzeile .wann { margin-left: auto; font-size: calc(12px * var(--sk)); color: var(--grau); white-space: nowrap; }
.eingangzeile .text { font-size: calc(13.5px * var(--sk)); color: var(--ink2); line-height: 1.5; white-space: pre-wrap; }
.lernkopf { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; padding: 0 4px; }
.lernkopf h2 { font-size: calc(20px * var(--sk)); margin: 0; }

/* ================= Schmale Fenster ================= */
@media (max-width: 720px) {
  :root { --pad: calc(13px * var(--sk)); --zeile: calc(40px * var(--sk)); }
  .app { padding: 0 var(--rand) 48px; gap: 0; padding-bottom: 96px; }
  .marke .wort { display: none; }
  .marke { margin-right: 0; padding: 0 8px 0 4px !important; margin-left: -4px; } .marke .ort::before { display: none; }
  .sicherknopf .txt { display: none; }
  .kopf-oben { overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
    /* Statt umzubrechen laeuft die Zeile im Notfall zur Seite. Bei offener
     Suche darf sie umbrechen, sonst hat das Suchfeld keinen Platz. */
    flex-wrap: nowrap; }
  .segmente button { justify-content: center; }
  .suchfach { display: none; }
  .app[data-suche="auf"] .suchfach { display: flex; order: 9; flex-basis: 100%; height: 32px; }
  .neuknopf .lang { display: none; }
  .neuknopf .kurz { display: inline; }
  .kopf-filter { padding: 6px var(--pad) 7px; font-size: calc(12px * var(--sk)); gap: 6px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
    /* Reiter und Werkzeuge in einer Zeile, die zur Seite laeuft, statt die
     ganze Seite breiter zu machen. */
    flex-wrap: nowrap; }
  .kopf-filter .stand { display: none; }
  .kopf-filter .werkzeuge { flex-wrap: nowrap; }
  .wahlfeld { font-size: calc(12px * var(--sk)); padding: 3px 5px; min-width: 0; flex: 1 1 auto; }
  .schalter { font-size: calc(12px * var(--sk)); flex-shrink: 0; }
  .datumknopf.leer { display: none; }
  /* iOS zoomt beim Fokus in jedes Feld unter 16px hinein. */
  input.titel, .punkt-feld, .notizfeld, .b-titel, .suchfeld,
  .d-titel, .d-notiz, select.eingabe, input.eingabe,
  input, textarea, select { font-size: max(16px, calc(16px * var(--sk))); }
  /* Der Cluster bleibt am Handy in der Zeile, nur schmaler — sonst ist er
     nur über das Blatt erreichbar und wird nie gepflegt. */
  .mk-cluster { padding: 2px 2px; text-overflow: clip;
    /* Der Ring darf die Zahl in seiner Mitte nicht anschneiden. */
    /* Jeder Pixel, der hier gespart wird, geht an den Titel. */
    width: 48px; }
  button.mk-cluster[data-leer="ja"] { width: 20px; font-size: calc(13px * var(--sk)); padding: 2px 0; opacity: .55; }
  .raster { grid-template-columns: minmax(0, 1fr); }
  /* Drei Reiter passen am Handy nicht neben Marke, Lupe und Neu-Knopf —
     also bekommen sie eine eigene Zeile über die volle Breite. */
  .segmente { order: 0;
    /* Jeder Pixel hier geht an die Knoepfe daneben: bei 375 Pixeln passt die
     Zeile genau einmal hin, darunter laeuft sie zur Seite. */
    /* Weiter oben steht fuer schmale Fenster noch flex:1 an diesen Knoepfen —
     als Zeichen sollen sie sich aber nicht die ganze Zeile teilen. */
    /* Vorher lagen die drei Reiter am Handy in einer eigenen Zeile ueber die
     volle Breite (order 8, flex-basis 100%). Genau die Zeile faellt jetzt weg. */
    flex-basis: auto; gap: 1px; flex-shrink: 0; }
  .dialogschicht { align-items: flex-end; padding: 0; }
  .dialog { max-width: none; border-bottom: none; max-height: 92vh; }
  .zweispalt { grid-template-columns: 1fr; }
}
@media (min-width: 721px) { .app[data-suche] .suchfach { display: flex; } .suchlupe { display: none; } }

/* Hover-Wirkungen nur bei echtem Zeigegerät — am Handy bleibt sonst
   die zuletzt berührte Zeile hängen, als wäre sie ausgewählt. */
@media (hover: hover) and (pointer: fine) {
  .segmente button:hover { color: var(--ink2); }
  .rundknopf:hover { border-color: var(--akzent); color: var(--akzent); }
  .neuknopf:hover { background: var(--akzent-hell); border-color: var(--akzent-hell); }
  .schalter:hover { color: var(--ink2); }
  .menu button:hover { background: var(--panel2); color: var(--ink); }
  .marke:hover .zeichen { color: var(--akzent-hell); }
  .zeile:hover { background: var(--panel2); }
  .haken:hover { border-color: var(--gruen); background: var(--gruen-weich); }
  .zeile:hover .datumknopf.leer { opacity: .55; }
  .datumknopf:hover { color: var(--akzent); opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
  .zeile:hover button.mk-cluster[data-leer="ja"] { opacity: .85; }
  button.mk-cluster:hover { border-color: var(--linie); color: var(--ink2); opacity: 1; }
  .clusterpop button:hover { background: var(--panel2); color: var(--ink); }
  .izeile:hover { background: var(--panel2); }
  .zurueck:hover { background: var(--panel); }
  .b-titel:hover { border-color: var(--linie); }
  .datumfeld:hover { border-color: var(--akzent); }
  .punkte li[data-st="laeuft"]:hover { background: var(--akzent-weich); }
  .punkt-feld:hover { border-color: var(--linie); }
  .punkte li:hover .weg { opacity: 1; }
  .v-text:hover { border-color: var(--linie); }
  .v-mehr:hover { color: var(--akzent); }
  .knopf:hover { background: var(--akzent-hell); border-color: var(--akzent-hell); }
  .knopf-leise:hover { background: var(--panel2); }
  .knopf-klein:hover { color: var(--rot); }
  .mikro:hover { color: var(--akzent); border-color: var(--akzent); }
  .dialog-kopf .zu:hover { border-color: var(--linie); background: var(--panel); color: var(--ink2); }
  .kal-schnell button:hover { border-color: var(--akzent); color: var(--akzent); }
  .kal-kopf button:hover { border-color: var(--linie); background: var(--panel2); }
  .kal-tag:hover { background: var(--akzent-weich); color: var(--akzent); }
  .kal-fuss button:hover { border-color: var(--rot); color: var(--rot); }
}

/* ================= Abschluss, Review, Archiv ================= */
.reviewkasten {
  border: 1px solid var(--akzent); border-radius: var(--r); background: var(--panel);
  display: flex; flex-direction: column; gap: 14px; padding: 16px 18px;
}
.reviewkasten .urteil { margin: 0; font-family: var(--kopf); font-weight: 600; font-size: calc(16.5px * var(--sk)); line-height: 1.45; color: var(--ink); }
.reviewfach { display: flex; flex-direction: column; gap: 7px; }
.reviewliste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.reviewliste li { display: flex; gap: 10px; align-items: flex-start; font-size: calc(14px * var(--sk)); line-height: 1.5; color: var(--ink); }
.reviewliste li::before { content: "\00b7"; color: var(--grau); flex-shrink: 0; font-weight: 700; }
.reviewliste[data-art="erreicht"] li::before { content: "\2713"; color: var(--gruen); }
.reviewliste[data-art="offen"] li::before { content: "\2192"; color: var(--akzent); }
.wartekasten {
  border: 1px dashed var(--linie); border-radius: var(--r); background: var(--panel2);
  padding: 14px 16px; font-size: calc(13.5px * var(--sk)); color: var(--grau);
}
.gruppe-kopf .marker[data-s="geprueft"] { background: var(--akzent); }
.gruppe-kopf .marker[data-s="review"] { background: var(--akzent); opacity: .5; }
.gruppe-kopf .marker[data-s="geschafft"] { background: var(--gruen); }
.gruppe-kopf .marker[data-s="erledigt"] { background: var(--grau); opacity: .45; }
[data-status="geschafft"] .fazit, [data-status="geprueft"] .fazit { background: var(--gruen-weich); border-color: color-mix(in srgb, var(--gruen) 26%, transparent); }
.izeile[data-status="geschafft"] .t1, .izeile[data-status="erledigt"] .t1 { color: var(--grau); }

/* ================= Mitschriften =================
   Ein Termin ist ein Blatt, kein Formular: oben was Claude daraus gemacht hat,
   darunter der Rohtext, wie Lukas ihn im Termin runtergeschrieben hat. */
.mzeile {
  width: 100%; display: flex; gap: 11px; align-items: center; min-height: var(--zeile);
  background: none; border: none; border-bottom: 1px solid var(--linie2);
  text-align: left; color: inherit; font: inherit;
}
.tafel .mzeile:last-child { border-bottom: none; }
.mz-tag { flex-shrink: 0; width: 54px; font-size: calc(12px * var(--sk)); color: var(--grau); font-variant-numeric: tabular-nums; }
.mz-titel {
  flex: 1 1 auto; min-width: 0; font-size: calc(14.5px * var(--sk)); font-weight: 500; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mz-meta { flex-shrink: 0; display: flex; align-items: center; gap: 9px; }
.mz-zahl { font-size: calc(11.5px * var(--sk)); color: var(--akzent); font-weight: 600; font-variant-numeric: tabular-nums; }
.mz-stand { font-size: calc(11px * var(--sk)); color: var(--grau); letter-spacing: .03em; }
.mz-stand[data-durch="ja"] { color: var(--gruen); }

/* Schreiben und Markieren sind zwei Zustände desselben Blocks. Im Termin wird
   getippt, hinterher werden Zeilen angetippt und bekommen ein Zeichen. */
.mblock { border: 1px solid var(--linie); border-radius: var(--r); background: var(--panel2); overflow: hidden; }
.mblock-kopf {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 12px;
  border-bottom: 1px solid var(--linie2); background: var(--panel2);
}
.mblock-kopf .werkzeuge { margin-left: auto; display: flex; gap: 7px; align-items: center; }
.mfeld {
  width: 100%; min-height: 340px; resize: vertical; display: block;
  font-family: inherit; font-size: calc(15px * var(--sk)); line-height: 1.7; color: var(--ink);
  background: var(--panel2); border: none; padding: 12px 14px;
}
.mfeld:focus { outline: none; background: var(--panel); }
.mzeilen { list-style: none; margin: 0; padding: 6px 0 10px; display: flex; flex-direction: column; }
.mzeilen li { display: flex; gap: 9px; align-items: flex-start; padding: 1px 12px 1px 10px; }
.mzeilen li[data-m="todo"] { background: color-mix(in srgb, var(--akzent-weich) 60%, transparent); box-shadow: inset 2px 0 0 var(--akzent); }
.mzeilen li[data-m="wichtig"] { background: color-mix(in srgb, var(--rot-weich) 55%, transparent); box-shadow: inset 2px 0 0 var(--rot); }
.mzeilen li[data-m="frage"] { box-shadow: inset 2px 0 0 var(--gruen); }
.mzeilen li.leerzeile { min-height: 12px; }
.m-marke {
  flex-shrink: 0; width: 20px; height: 25px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; color: var(--grau); font-size: calc(12px * var(--sk)); line-height: 1;
  opacity: .35; transition: opacity .12s ease, color .12s ease;
}
.mzeilen li[data-m="todo"] .m-marke { opacity: 1; color: var(--akzent); }
.mzeilen li[data-m="wichtig"] .m-marke { opacity: 1; color: var(--rot); font-weight: 700; }
.mzeilen li[data-m="frage"] .m-marke { opacity: 1; color: var(--gruen); font-weight: 700; }
.m-text {
  flex: 1 1 auto; min-width: 0; padding: 3px 0; line-height: 1.6;
  font-size: calc(14.5px * var(--sk)); color: var(--ink); white-space: pre-wrap; word-break: break-word; cursor: text;
}
.m-hilfe { font-size: calc(12.5px * var(--sk)); color: var(--grau); margin: 0; padding: 0 4px; }

/* Was der Sonntagslauf aus dem Rohtext gemacht hat. Steht über der Mitschrift,
   weil Lukas beim Wiederaufmachen das Ergebnis sucht, nicht den Rohtext. */
.mfazit {
  border: 1px solid var(--linie); border-left: 3px solid var(--akzent);
  border-radius: var(--r); background: var(--panel); padding: 15px 17px;
  display: flex; flex-direction: column; gap: 13px;
}
.mfazit .kurz { margin: 0; font-family: var(--kopf); font-weight: 600; font-size: calc(16px * var(--sk)); line-height: 1.45; color: var(--ink); }
.mfazit-fach { display: flex; flex-direction: column; gap: 6px; }
.mliste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.mliste li { display: flex; gap: 10px; align-items: flex-start; font-size: calc(14px * var(--sk)); line-height: 1.5; color: var(--ink); }
.mliste li::before { content: "\00b7"; color: var(--grau); font-weight: 700; flex-shrink: 0; }
.mliste[data-art="fragen"] li::before { content: "?"; color: var(--gruen); }
.mnoch { border: 1px dashed var(--linie); border-radius: var(--r); background: var(--panel2); padding: 13px 15px; font-size: calc(13.5px * var(--sk)); color: var(--grau); }

/* ================= Vorschläge aus den Mitschriften =================
   Nichts davon wird zur Aufgabe, bevor Lukas es einzeln freigegeben hat. */
.vbalken {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 11px 15px; margin: 6px 0 2px;
  border: 1px solid var(--akzent); border-radius: var(--r);
  background: var(--akzent-weich); color: var(--ink);
  font-family: var(--kopf); font-size: calc(14px * var(--sk)); font-weight: 600; text-align: left;
}
.vbalken .pkt { width: 7px; height: 7px; border-radius: 50%; background: var(--akzent); flex-shrink: 0; }
.vbalken .leiser { margin-left: auto; font-weight: 500; font-size: calc(12.5px * var(--sk)); color: var(--akzent); }
@media (prefers-reduced-motion: no-preference) {
  .vbalken .pkt { animation: wach 3.2s ease-in-out infinite; }
}
.vorschlag { padding: 15px var(--pad); border-top: 1px solid var(--linie2); display: flex; flex-direction: column; gap: 11px; }
.tafel .vorschlag:first-child { border-top: none; }
.tafel > .zeile[data-erledigt="ja"]:last-child { border-bottom-color: var(--linie2); }
.tafel > .zeile[data-fokus="naechstes"]:last-child { border-bottom-color: var(--akzent); }
.tafel > .zeile[data-fokus="naechstes"][data-erledigt="ja"]:last-child { border-bottom-color: var(--linie2); }
.vorschlag .quelle { font-size: calc(12px * var(--sk)); color: var(--grau); }
.vorschlag .vtitel {
  width: 100%; min-height: 44px; resize: none;
  font-family: var(--kopf); font-size: calc(15.5px * var(--sk)); font-weight: 600; line-height: 1.4; color: var(--ink);
  background: var(--panel2); border: 1px solid var(--linie); border-radius: 6px; padding: 9px 11px;
}
.vorschlag .vtitel:focus { outline: none; border-color: var(--akzent); background: var(--panel); }
.vfelder { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 11px; align-items: start; }
.vgrund { margin: 0; font-size: calc(13.5px * var(--sk)); color: var(--ink2); line-height: 1.55; }
.vpunkte { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.vpunkte li { display: flex; gap: 9px; font-size: calc(13.5px * var(--sk)); color: var(--ink2); line-height: 1.5; }
.vpunkte li::before { content: "\2610"; color: var(--grau); flex-shrink: 0; }
.vfuss { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.vfuss .weg { margin-left: auto; }
.vprio { display: flex; gap: 5px; }
.vprio button {
  flex: 1; font-family: var(--kopf); font-size: calc(11.5px * var(--sk)); font-weight: 600; letter-spacing: .03em;
  padding: 8px 5px; border-radius: 6px; border: 1px solid var(--linie); background: var(--panel2); color: var(--ink2);
}
.vprio button[aria-pressed="true"][data-p="1"] { background: var(--rot-weich); border-color: var(--rot); color: var(--rot); }
.vprio button[aria-pressed="true"][data-p="2"] { background: var(--panel); border-color: var(--ink2); color: var(--ink); }
.vprio button[aria-pressed="true"][data-p="3"] { background: var(--panel); border-color: var(--grau); color: var(--ink2); }
.vfertig { padding: 12px var(--pad); border-top: 1px solid var(--linie2); display: flex; gap: 10px; align-items: baseline; font-size: calc(13.5px * var(--sk)); color: var(--grau); }
.vfertig .was { color: var(--ink2); flex: 1 1 auto; min-width: 0; }
.vfertig .lage { flex-shrink: 0; }

.blatt[data-notiz] .datumfeld[data-eilig="ja"] { color: var(--ink); font-weight: 400; }
.mblock-kopf .kurzhilfe { display: none; }
@media (max-width: 720px) {
  .mblock-kopf .m-hilfe { display: none; }
  .mblock-kopf .kurzhilfe { display: inline; }
}
/* ================= Dashboard =================
   Der Kopf über der Liste. Kein eigener Reiter: die Aufgaben stehen direkt
   darunter, so wie Lukas es beim Aufmachen will. Alles hier ist anklickbar
   und filtert die Liste — Zahlen, die man nicht anfassen kann, sind Deko. */
.dash { display: flex; flex-direction: column; }
.dash-kopf {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: nowrap; padding-left: var(--rand); padding-right: var(--rand);
}
.dash-tag {
  font-family: var(--kopf); color: var(--ink); white-space: nowrap; flex-shrink: 0; font-size: calc(15px * var(--sk)); font-weight: 600; letter-spacing: -.015em;
}
.dash-spur { color: var(--grau); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dash-klapp {
  margin-left: auto; color: var(--grau);
  background: none; border: none; padding: 4px 6px;
  display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
.dash-klapp .pfeil { font-size: calc(10px * var(--sk)); transition: transform .18s ease; }
.dash[data-zu="ja"] .dash-klapp .pfeil { transform: rotate(-90deg); }
.dash[data-zu="ja"] .dash-koerper { display: none; }

.dash-koerper { display: flex; flex-direction: column; padding-left: var(--rand); padding-right: var(--rand); }
.dash-haupt { display: flex; }

/* Der Ring: drei Bahnen, außen der Tag, dann die Woche, innen alles Offene.
   Die Bögen wachsen beim Aufmachen einmal ruhig hoch — das ist die einzige
   Bewegung hier, damit der Blick weiß, wo er hinsoll. */

/* Sieben Tage, sieben Säulen. Sagt in einem Blick, ob die Woche läuft. */
.dash-woche { display: flex; flex-shrink: 0; min-width: 0; order: 2;
  flex-direction: column;
  /* Balken in die Mitte, Legende nach rechts. */
  margin-left: 0; align-items: stretch; gap: 8px; }
/* 23.09.2026: Die Balken waren so niedrig, dass jeder Tag wie dieselbe Pille
   aussah. Jetzt haben sie Hoehe, und ein leerer Tag ist nur eine Grundlinie. */
.wbalken { display: flex; align-items: flex-end; height: calc(64px * var(--sk)); gap: 6px; }
.wtag { display: flex; flex-direction: column; align-items: center;
  background: none; border: none; padding: 0; height: 100%; flex: 1 1 0; width: auto;
  /* Die Wochenbalken bekommen Schienen — volle Breite ohne leere Striche. */
  justify-content: flex-end; gap: 6px;
}
.wtag .saeule { background: var(--linie);
  transition: height .5s var(--ease-aus); min-height: 0; width: 100%; border-radius: 7px;
}
.wtag .kuerzel { color: var(--grau); }
.wtag[data-heute="ja"] .kuerzel { font-weight: 700; color: var(--akzent); }
.wserie { white-space: nowrap; text-align: center; margin-top: 1px; color: var(--grau); font-size: calc(11px * var(--sk)); }
.wserie b { color: var(--ink2); font-weight: 600; }

/* Was brennt. Nur hier darf Rot stehen — die Farbregel bleibt. */

/* Cluster als Kacheln — eine Reihe, die zur Seite läuft statt umzubrechen. */

/* Der Balken für das, was von gestern übrig ist. Verschwindet, sobald Lukas
   entschieden hat — er soll nicht jeden Tag dieselbe Frage sehen. */
.uebertrag {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 10px 13px; border: 1px solid var(--akzent); border-radius: var(--r);
  background: var(--akzent-weich); font-size: calc(13.5px * var(--sk)); color: var(--ink); margin: 4px 0 2px;
}
.uebertrag .pkt { width: 7px; height: 7px; border-radius: 50%; background: var(--akzent); flex-shrink: 0; }
.uebertrag .werkzeuge { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.uebertrag button {
  font-family: var(--kopf); font-size: calc(12.5px * var(--sk)); font-weight: 600; padding: 5px 11px; border: 1px solid var(--akzent); background: var(--akzent); color: var(--akzent-text);
}
.uebertrag button.leise { background: none; color: var(--akzent); border-color: color-mix(in srgb, var(--akzent) 40%, transparent); }

/* ================= Fokus =================
   Der Stern sagt: das nehme ich mir als naechstes vor. Eine Stufe, kein
   Tagesbezug — Lukas am 12.09.2026: "besser, wenn die Funktion nicht fuer
   Heute, sondern fuer als naechstes gedacht ist". */
.fokus {
  flex-shrink: 0; width: 21px; height: 21px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; color: var(--linie);
  transition: color .12s ease, transform .12s ease;
}
.fokus svg { display: block; }
[data-erledigt="ja"] .fokus { opacity: .3; }

.fokus-wahl { display: flex; gap: 5px; max-width: 470px; }
.fokus-wahl button {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--kopf); letter-spacing: .03em;
  border: 1px solid var(--linie); background: var(--panel2); color: var(--ink2);
}
.fokus-wahl button[aria-pressed="true"] { border-color: var(--gold); }
.fokus-wahl svg { flex-shrink: 0; }

/* Die Reiter über der Liste: Heute, Woche, Alles, Erledigt. */
.lreiter { display: flex; gap: 2px; flex-shrink: 0; }
.lreiter button {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--kopf); color: var(--grau);
  background: none; border: none; white-space: nowrap;
}
.lreiter .zahl { font-size: calc(11.5px * var(--sk)); opacity: .75; font-variant-numeric: tabular-nums; }

/* ================= Schwebender Anlegen-Knopf =================
   Ein neues ToDo muss von überall in einem Griff gehen. Am Rechner tut es die
   Taste N, am Handy dieser Knopf unten rechts — in Daumenreichweite. */
.fab {
  position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  z-index: 30; width: 52px; height: 52px; padding: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--akzent); color: var(--akzent-text); border: none;
  box-shadow: 0 6px 20px rgba(8,8,10,.24), 0 0 0 1px color-mix(in srgb, var(--akzent) 55%, transparent);
  font-size: calc(25px * var(--sk)); line-height: 1;
}
@media (prefers-reduced-motion: no-preference) {
  .fab { transition: transform .16s var(--ease-aus), opacity .16s ease; }
  .fab:active { transform: scale(.93); }
}
@media (min-width: 721px) { .fab { display: none; } }
.hinweiszeile .zurueckknopf {
  margin-left: auto; flex-shrink: 0;
  font-family: var(--kopf); font-size: calc(12.5px * var(--sk)); font-weight: 600; color: var(--akzent);
  background: none; border: 1px solid color-mix(in srgb, var(--akzent) 40%, transparent);
  border-radius: 5px; padding: 4px 11px;
}

@media (max-width: 720px) {
  .dash-woche { min-width: 0; flex-direction: column; margin-top: 2px; align-items: stretch; width: auto; gap: 4px; }
  /* Die Zeile muss bei 40 Pixeln bleiben und darf nicht umbrechen —
     der Stern ist deshalb schmaler und immer sichtbar, wenn er gesetzt ist. */
  .fokus {
    /* Der Titel braucht am Handy jeden Pixel — der Stern kostet eine Spalte,
     also geben die anderen etwas ab. Zeile misst danach 40 Pixel. */
    width: 17px; height: 17px; }
}
@media (hover: hover) and (pointer: fine) {
  .fokus:hover { transform: scale(1.15); }
  .dash-klapp:hover { color: var(--ink2); }
  .fab:hover { background: var(--akzent-hell); }
}
/* ---- Nachjustiert nach dem ersten Durchgang ---- */
.uebertrag .was { display: flex; align-items: baseline; gap: 9px; flex: 1 1 240px; min-width: 0; }
.uebertrag .was .pkt { position: relative; top: -1px; }

@media (max-width: 720px) {
  .kopf-filter::-webkit-scrollbar { display: none; }
  .kopf-filter .werkzeuge { width: auto; flex: 0 0 auto; margin-left: 8px; }
  .kopf-filter .wahlfeld { flex: 0 0 auto; max-width: 148px; }
  .lreiter { flex: 0 0 auto; }
}
.dialog .fokus-wahl { max-width: none; }
.dialog .fokus-wahl button { padding: 9px 4px; gap: 5px; }
/* ================= Listenleiste =================
   Seit dem 12.09.2026 die einzige Steuerung der Liste. Sie sitzt direkt über
   ihr statt oben im Kopf — dort war die zweite Zeile eine Zeile zu viel. */
.listenleiste {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  position: sticky; top: var(--kopfhoehe, 84px); z-index: 6;
  margin: 0; padding-left: var(--rand); padding-right: var(--rand); padding: 5px 4px 6px;
}
.listenleiste .sortwahl { margin-left: auto; flex-shrink: 0; }
.filterchip {
  display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0;
  font-family: inherit; font-size: calc(12.5px * var(--sk)); font-weight: 500; border: 1px solid var(--akzent); white-space: nowrap; padding: 4px 11px;
}
.filterchip .weg { font-size: calc(13px * var(--sk)); opacity: .8; }

/* Die Legendenzeile filtert jetzt. Das × steht nur beim aktiven Filter da,
   der Platz dafür ist immer reserviert — sonst rutscht die Zeile beim
   Anklicken um ein paar Pixel. */

/* Vorgemerktes steht oben in der Liste, mit Flieder statt grauem Punkt. */
.gruppe-kopf .marker[data-fokus] { opacity: 1; background: var(--gold); }

/* Hoch rot, Mittel gold, Niedrig grau \u2014 im Gruppenbalken, im Punkt der Zeile
   und in der Auswahl im Blatt. Gold ist frei, seit der Stern weg ist. */
.gruppe-kopf[data-p] { height: 34px; }
.gruppe-kopf > span:not(.marker):not(.anzahl) { padding-left: 0; }
.gruppe-kopf[data-p="3"] .gname::before { opacity: .45; }

@media (max-width: 720px) {
  .listenleiste {
    gap: 7px; flex-wrap: nowrap; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none; padding-left: var(--rand); padding-right: var(--rand);
  }
  .listenleiste::-webkit-scrollbar { display: none; }
  .listenleiste .sortwahl { max-width: 130px; }
  .filterchip { font-size: calc(12px * var(--sk)); }
}
@media (hover: hover) and (pointer: fine) {
  .filterchip:hover { background: var(--akzent); color: var(--akzent-text); }
  .lreiter button:hover { color: var(--ink2); }
}
/* ---- Nachjustiert am 12.09.2026 ---- */

@media (max-width: 720px) {
  /* Im Kopf des Dashboards darf nichts umbrechen — sonst frisst die
     Datumszeile allein zwei Zeilen. */
  .dash-klapp .wort { display: none; }
  .dash-klapp { padding: 4px 2px 4px 8px; }
}

/* ================= Fristzeile =================
   Steht direkt ueber der Liste und sagt, was liegt. Bis zum 12.09.2026 waren
   das Chips im Dashboard, die die Liste umgeschaltet haben. Lukas: "eher als
   Hinweis zu verstehen als als Filter" — ein Klick springt jetzt zur ersten
   betroffenen Aufgabe, statt alles andere wegzufiltern. */
.fristzeile {
  display: flex; align-items: center; flex-wrap: wrap; gap: 2px;
  font-size: calc(12.5px * var(--sk)); color: var(--grau); margin: 0; padding-left: var(--rand); padding-right: var(--rand);
}
.fristzeile .ruhig { padding: 0 5px; }
.fristteil {
  display: inline-flex; align-items: baseline; gap: 6px;
  font-family: inherit; font-size: calc(12.5px * var(--sk)); color: var(--grau);
  background: none; border: 1px solid transparent; border-radius: 5px; padding: 3px 7px;
  white-space: nowrap;
}
.fristteil .zahl { color: var(--ink2); font-variant-numeric: tabular-nums;
}
.fristteil[data-art="ueberfaellig"] { color: var(--rot); }
.fristteil[data-art="ueberfaellig"] .zahl { color: var(--rot); }
.fristteil[data-art="kritisch"] { color: color-mix(in srgb, var(--rot) 52%, var(--ink2)); }
.fristteil[data-art="kritisch"] .zahl { color: color-mix(in srgb, var(--rot) 52%, var(--ink2)); }
.fristteil .zahl, .lreiter .zahl, .segmente .zahl, .clusterliste .wieviel {
  font-family: var(--marke-schrift); font-weight: 500;
}
/* Die beiden unteren Legendenzeilen sind reine Anzeigen, keine Knoepfe —
   also stehen sie auch etwas leiser da. */
.fristzeile .punkt { color: var(--linie); padding: 0 1px; }

/* Das Aufleuchten ist die ganze Rueckmeldung des Sprungs: kurz heller werden,
   dann wieder still. Ohne das findet man die Zeile nicht, zu der man springt. */
@media (prefers-reduced-motion: no-preference) {
  .zeile.aufleuchten { animation: leuchten 1.7s var(--ease-aus); }
  @keyframes leuchten {
    0% { background: var(--akzent-weich); }
    22% { background: var(--akzent-weich); }
    100% { background: transparent; }
  }
}
@media (prefers-reduced-motion: reduce) {
  .zeile.aufleuchten { background: var(--akzent-weich); }
}

/* ================= Angefangen =================
   Auch eine Aufgabe ohne Unterpunkte kann laufen. Seit 22.09.2026 macht das der
   Haken selbst: erster Tipper "läuft", zweiter hakt ab. */
.zeile[data-laeuft="ja"] {
  box-shadow: none; background: var(--panel); }
.zeile[data-laeuft="ja"] > .z-kopf > .haken { border-color: var(--ocker); background: var(--panel); }
.zeile[data-laeuft="ja"] > .z-kopf > .haken svg { display: none; }
.zeile[data-laeuft="ja"] > .z-kopf > .haken::after {
  content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ocker);
}
.zeile[data-prio="1"][data-laeuft="ja"] { box-shadow: none;
}
.zeile.wischt[data-wischseite="rechts"][data-wisch="unvor"]::before {
  content: "Vormerkung weg"; background: var(--panel2); color: var(--grau);
}
.zeile.wischt[data-wischseite="links"][data-wisch="stopp"]::after {
  content: "Pausiert"; color: var(--grau); background: var(--panel2);
}
@media (prefers-reduced-motion: no-preference) {
  .zeile[data-laeuft="ja"] > .z-kopf > .haken::after { animation: haltbar 3.6s ease-in-out infinite; }
  .zeile, .haken, .titel, .datumknopf { transition: border-color .2s ease, background .2s ease, color .2s ease; }
  .zeile[data-fokus="naechstes"][data-erledigt="ja"].eben { animation-name: ebengruen; }
  @keyframes haltbar { 0%, 100% { opacity: 1; } 50% { opacity: .42; } }
}
.blatt .lage[data-lauf="ja"] { color: var(--ocker); background: var(--ocker-weich); }
.laufknopf[aria-pressed="true"] { border-color: var(--ocker); color: var(--ocker); background: var(--ocker-weich); }

/* ================= Eine Zeile am Handy =================
   Lukas am 12.09.2026: "in der Handy UI sollten die Gruppierungen, das Suchen,
   die Einstellungen und das Zeichen von Klar in eine Zeile, das nimmt sonst zu
   viel Platz weg". Die Listenleiste wandert dafuer am Handy in den Kopf —
   dieselben Knoepfe, ein Ort weniger. Am Rechner bleibt sie ueber der Liste. */
.segmente .ikon { display: none; }
.segmente button, .lreiter button { font-weight: 500; padding: 5px 10px; font-size: calc(12.5px * var(--sk)); }
:root[data-theme="dark"] .segmente button[aria-pressed="true"] .zahl,
:root[data-theme="dark"] .lreiter button[aria-pressed="true"] .zahl { color: var(--grau); opacity: 1; }
.kopfleiste { display: flex; align-items: center; gap: 7px; min-width: 0; }
.kopfleiste:empty { display: none; }
.sortknopf {
  width: 32px; height: 32px; padding: 0; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; border: 1px solid var(--linie); color: var(--ink2);
}
@media (max-width: 720px) {
  .segmente .ikon { display: flex; align-items: center; }
  .segmente .wort, .segmente .zahl { display: none; }
  .segmente button { flex: 0 0 auto; }
  .kopfleiste { gap: 5px; }
  .sortknopf { width: 29px; height: 29px; }
  .segmente button .ikon { position: relative; }
  .segmente button[data-warte="ja"] .ikon::after {
    content: ""; position: absolute; top: -2px; right: -4px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--akzent);
  }
  .kopf-oben::-webkit-scrollbar { display: none; }
  .kopf-oben .rechts, .kopf-oben .kopfleiste { flex-shrink: 0; }
  .app[data-suche="auf"] .kopf-oben { flex-wrap: wrap; overflow-x: visible; }
  .kopfleiste .lreiter button { padding: 6px; font-size: calc(11.5px * var(--sk)); }
  .kopfleiste .lreiter .zahl { display: none; }
  .kopfleiste .filterchip { max-width: 116px; overflow: hidden; text-overflow: ellipsis; }
  .fristzeile { gap: 0; padding-left: var(--rand); padding-right: var(--rand); }
  .fristteil { padding: 3px 5px; }
}

/* ================= Dichte =================
   Vier Stufen, umschaltbar im ⋯-Menü, gespeichert unter ideenbrett.dichte.
   Voreinstellung ist Kompakt — die frühere Größe entspricht "Normal". */
:root[data-dichte="eng"] { --sk: 0.8; }
:root[data-dichte="kompakt"] { --sk: 0.86; }
:root[data-dichte="normal"] { --sk: 0.93; }
:root[data-dichte="gross"] { --sk: 1.02; }
.dichtewahl { display: flex; gap: 2px; padding: 3px 6px 5px; }
.dichtewahl button {
  flex: 1; justify-content: center; padding: 6px 3px !important;
  font-size: 12px; border: 1px solid var(--linie) !important;
  color: var(--grau);
}
.dichtewahl button[aria-pressed="true"] { border-color: var(--akzent) !important; color: var(--akzent); background: var(--akzent-weich); }
.menuname {
  padding: 7px 11px 2px;
}

/* ---- Auszeichnungsschrift: nur Ueberschriften und grosse Zahlen ---- */
.lage-kopf h2, .lernkopf h2 { font-family: var(--anzeige); }
.dialog-kopf .titel { font-size: calc(16px * var(--sk)); }

/* ---- Form der Elemente: Pillen statt Kaestchen ----
   Knoepfe und Chips wie die Zweigknoepfe im Baum. Die Zeile selbst bleibt
   eckig und ruhig — sie ist die Arbeitsflaeche. */
.knopf, .knopf-leise, .neuknopf, .uebertrag button { border-radius: 999px; }
.knopf, .neuknopf { font-weight: 500; letter-spacing: .01em; }
.lage, .izeile .bereich, .skillmarke { padding: 3px 10px; }
.segmente, .lreiter { padding: 2px; background: var(--panel2); }
.prio-wahl button, .fokus-wahl button, .kal-schnell button { font-weight: 500; }

/* ---- Flaechen: feine Linie, weiches Glas, tiefer Schatten ---- */
.blatt, .detail, .kasten, .lage-karte, .ziel, .entwurfkasten, .rueckfrage {
  border-color: var(--rand-linie);
}
.menu, .clusterpop, .kalenderkasten {
  background: var(--glas); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
}
.dialog-kopf, .dialog-fuss, .balken { background: none; }
.dialog-kopf, .balken { border-bottom-color: var(--linie2); }

/* ---- Ocker heisst angefangen ----
   Der Baum faerbt Offenes ockerfarben, Erreichtes gold. Klar uebernimmt das
   fuer den mittleren Zustand: was laeuft, steht jetzt in Ocker statt in
   Flieder — Flieder bleibt damit die Farbe fuer "ausgewaehlt". */
.punkte li[data-st="laeuft"] .haken { background: var(--panel); }
.lage[data-z="wartet"] { color: var(--ocker); background: var(--ocker-weich); }

/* ---- Gold heisst: das nehme ich mir als naechstes vor ----
   Der leere Stern stand bis 13.09.2026 auf unsichtbar und tauchte erst beim
   Darueberfahren auf — am Handy also nie. Jetzt steht er blass, aber da. */
.fokus[data-f="naechstes"] { color: var(--gold); }
.fokus[data-f=""] { opacity: 1; color: color-mix(in srgb, var(--grau) 55%, transparent); }
.zeile:hover .fokus[data-f=""], .fokus[data-f=""]:focus-visible { opacity: 1; color: var(--gold); }
[data-erledigt="ja"] .fokus[data-f=""] { opacity: .35; }
@media (max-width: 720px) { .fokus[data-f=""] { opacity: 1; } }
@media (hover: hover) and (pointer: fine) { .fokus:hover { color: var(--gold); } }
.fokus-wahl button[aria-pressed="true"] {
  background: var(--ocker-weich); color: var(--gold);
}

/* ---- Der Verlauf als Bahn, wie die Zweige im Baum ---- */
.verlauf .knoten { background: var(--akzent-hell); }

/* ---- Ein Hauch Flieder ueber der Leinwand, wie der Nebel im Baum ---- */
/* Der Flieder-Hauch ueber der Leinwand ist am 13.09.2026 wieder raus —
   im Baum traegt er die Seite, in einer Arbeitsliste wurde alles blau. */
.kopf, .listenleiste { background: color-mix(in srgb, var(--leinwand) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }

/* ===== 16.09.2026: Notiz am Unterpunkt, ein Stern-Knopf, Angefangen aus der Liste ===== */
.punkte li { gap: 0; }
/* Lange Notizen nicht das ganze Blatt füllen lassen: zwei Zeilen, beim Antippen alles. */

.sternknopf { display: inline-flex; align-items: center; gap: 6px; }
.sternknopf svg { flex: none; }
.sternknopf[aria-pressed="true"] { border-color: var(--akzent); color: var(--akzent); background: var(--akzent-weich); }
.fokus-wahl button.sternknopf { flex: 0 0 auto; padding: 8px 14px; }
@media (max-width: 720px) {
  .balken .sternknopf { padding-left: 10px; padding-right: 10px; }
}
.zeile.wischt { overflow: hidden; }
.zeile.wischt::before { position: absolute; left: 0; top: 0; bottom: 0; width: 150px;
  display: flex; align-items: center; padding-left: 12px; white-space: pre;
  color: var(--ocker); background: var(--ocker-weich); opacity: .55; transition: opacity .12s ease; content: "\25B6  Angefangen"; font-size: calc(11.5px * var(--sk));
}
.zeile.wischt[data-wisch="stopp"]::before { content: "Läuft nicht mehr"; font-size: calc(11.5px * var(--sk)); color: var(--grau); background: var(--panel2); }
.zeile.wisch-bereit::before { opacity: 1; }
.zeile.wischt > .z-kopf { position: relative; z-index: 1; background: var(--panel); border-radius: calc(var(--r) - 1px); }
.zeile.wischt[data-laeuft="ja"] > .z-kopf { background: var(--panel); }

/* ===== 16.09.2026 (3): Notiz immer, Lösung ab „läuft“ =====
   Lukas: „mach doch einfach immer die möglichkeit eine Notiz anzulegen, aber sobald
   ich den Punkt auf In Bearbeitung setze, erweitert sich dieser strich nach unten
   und ich kann auch eine Lösung angeben.“ Die Punktzeile ist das ToDo. Darunter
   hängt an einer feinen Linie aus dem Haken die Notiz — immer da. Ab „läuft“
   wächst die Linie nach unten und die Lösung kommt dazu. */
.punkte .punkt-feld { font-weight: 500; }
.p-zweige { margin: 0 0 6px 8px; padding-left: 19px; border-left: 1.5px solid var(--linie); display: flex; flex-direction: column; }
.punkte li[data-st="laeuft"] .p-zweige { border-left-color: color-mix(in srgb, var(--ocker) 55%, transparent); }
.punkte li[data-st="fertig"] .p-zweige { border-left-color: color-mix(in srgb, var(--gruen) 55%, transparent); }
.p-ast { display: flex; gap: 6px; align-items: flex-start; }
.p-ast .marke-k {
  flex: 0 0 auto; min-width: 50px; margin-right: 8px; padding-top: 3px;
}
.p-ast textarea {
  flex: 1 1 auto; min-width: 0; min-height: 0; resize: none;
  /* 23.09.2026: Das Feld waechst mit dem Text bis etwa zehn Zeilen, danach
     scrollt es. Vorher war es ohne Fokus auf zwei Zeilen gekappt. */
  overflow-y: auto; max-height: calc(15em * var(--sk));
  scrollbar-width: thin; scrollbar-color: var(--linie) transparent;
  font-family: inherit; font-size: calc(13px * var(--sk)); line-height: 1.5; color: var(--ink2);
  background: transparent; border: none; border-bottom: 1px solid transparent; border-radius: 0; padding: 1px 0 5px;
}
.p-ast textarea::placeholder { color: var(--grau); opacity: .55; }
/* Laeuft der Text weiter, als das Feld zeigt, blendet der untere Rand aus —

.p-ast textarea.ueberlauf:not(:focus) { -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent); mask-image: linear-gradient(to bottom, #000 78%, transparent); }
.p-ast textarea::-webkit-scrollbar { width: 6px; }
.p-ast textarea::-webkit-scrollbar-thumb { background: var(--linie); border-radius: 3px; }
.p-ast textarea:focus { outline: none; border-bottom-color: var(--akzent); color: var(--ink); }
.p-ast .mikro { width: 26px; height: 26px; flex: none; opacity: .35; margin-top: -2px; }
.p-ast .mikro:hover, .p-ast .mikro[data-an="ja"] { opacity: 1; }
.p-ast.loesung .marke-k { color: var(--ocker); }
.p-ast.loesung { display: grid; grid-template-rows: 1fr; }
.p-ast.loesung > .p-ast-innen { overflow: hidden; min-height: 0; display: flex; gap: 6px; align-items: flex-start; }
@media (prefers-reduced-motion: no-preference) {

  @keyframes astwachsen { from { grid-template-rows: 0fr; opacity: 0; } to { grid-template-rows: 1fr; opacity: 1; } }

.sicherknopf[data-art="fehler"] .pkt { background: var(--rot); }
/* ===== 22.09.2026: Erledigtes bleibt lesbar =====
   Lukas: "ich müsste zumindest noch besser erkennen können was der Unterpunkt
   denn überhaupt war". Der Strich ist das Signal, nicht der Text — also bleibt
   der Text kontrastreich und nur die Linie wird dünn und grün. */
.punkte li[data-ok="ja"] .punkt-feld {
  color: var(--ink2);
}
[data-erledigt="ja"] .titel {
  color: var(--ink2);
}

/* Der Haken in der Zeile erklärt sich beim Draufzeigen von selbst. */
@media (hover: hover) {
  .zeile[data-erledigt="nein"][data-laeuft="nein"] > .z-kopf > .haken:hover {
    border-color: var(--ocker); background: var(--ocker-weich);
  }

  .zeile[data-erledigt="nein"][data-laeuft="nein"] > .z-kopf > .haken:hover::after {
    content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ocker); opacity: .75;
  }
}
/* ===== 22.09.2026 (2): Position bleibt, Farbe erklaert =====
   Lukas an diesem Tag: der eigene Block "Als naechstes" schiebt Aufgaben
   herum, der Stern doppelt sich mit ihm, die Cluster helfen ihm nicht, und der
   Punkt beim Draufzeigen sitzt schief. Also: nichts wandert mehr, Fettung
   zeigt das Vorgenommene, Farbe zeigt die Prioritaet. */

/* Der Punkt sass neben dem unsichtbaren Haken statt an seiner Stelle:
   opacity:0 nimmt weiter Platz weg, display:none nicht. */

/* Vorgemerkt heisst jetzt: fetter Titel. Kein Stern, kein eigener Block. */

.prio-wahl button[data-p="1"] { color: color-mix(in srgb, var(--rot) 70%, var(--ink2)); }
.prio-wahl button[data-p="2"] { color: color-mix(in srgb, var(--gold) 76%, var(--ink2)); }
.prio-wahl button[data-p="3"] { color: var(--grau); }
.prio-wahl button[aria-pressed="true"][data-p="1"] { background: var(--rot-weich); border-color: var(--rot); color: var(--rot); font-weight: 700; }
.prio-wahl button[aria-pressed="true"][data-p="2"] { background: var(--ocker-weich); border-color: var(--gold); color: var(--gold); font-weight: 700; }
.prio-wahl button[aria-pressed="true"][data-p="3"] { background: var(--panel2); border-color: var(--grau); color: var(--ink2); font-weight: 700; }

/* Pausieren war ein Symbol, das erst beim Draufzeigen auftauchte \u2014 am Handy
   also nie. Jetzt steht es da, aber nur an dem, was gerade laeuft. */
/* ===== 22.09.2026 (3): Farbe statt Flaeche, Wischen in beide Richtungen =====
   Lukas: das Fett allein faellt nicht auf, die orange Flaeche ist zu viel, und
   der Pausenknopf sagt dasselbe wie die Flagge. Also Flieder fuer das

.laufflag {

}

/* 23.09.2026: Am Handy zeigt der Haken mit Punkt schon, dass etwas laeuft —
   die Pille davor war dasselbe Signal noch einmal und kostete Titelbreite. */
@media (max-width: 720px) {

/* Die Leiste rechts rueckt an den Rand. */

/* Wischen: rechts merkt vor, links faengt an oder pausiert. */
.zeile.wischt[data-wischseite="rechts"]::before {
  content: "Als nächstes"; background: var(--akzent-weich); color: var(--akzent);

}

/* ===== 22.09.2026 (4): Die Leisten ruecken an den Rand =====
   Lukas: "da ist so ein awkward abstand der platz kostet". Es waren zwei
   verschiedene Einzuege im Spiel — die Seite lief auf --rand, die Zeilen und
   Gruppenbalken zusaetzlich auf --pad. Jetzt steht alles auf derselben
   schmalen Kante, und der Titel bekommt die gewonnene Breite. */

.z-kopf, .gruppe-kopf, .izeile, .mzeile {

.gruppe { margin: 0; }

.tafel {
  display: flex; flex-direction: column;
  background: none; border: none; border-radius: 0;

.tafel > .zeile, .tafel > .izeile, .tafel > .mzeile,

/* ---- Uebergaenge: der Inhalt gleitet einmal herein ---- */

  #inhalt.wechsel { animation: reinkommen .34s var(--ease-aus) both; }
