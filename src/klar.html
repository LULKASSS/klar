/* Der kurze Schimmer beim Umschalten folgt derselben Bedeutung. */

/* =====================================================================
   22.09.2026 (11) — Das Dashboard am Handy
   Lukas: "am Handy muss das Dashboard auf jeden Fall viel kleiner." Statt
   drei Bloecke untereinander steht am Handy oben die Zahl neben dem

/* ---- Karten statt Linien ----

/* Der Rahmen bedeutet weiter genau eine Sache: das nehme ich mir als

  background: none; color: var(--ink2);

/* 23.09.2026: Zeitstrahl und Wissensbaum tragen ihren Namen, nicht nur ein

/* Der Knopf oben im Kopf ist damit doppelt. */

/* Im Dunkeln kehrt sich die schwarze Pille um; ungedaempft ist sie das

/* ---- Flaechen wie im Beispiel: rund, weiss, schwebend, ohne Linie ---- */

/* ---- Bedienelemente: Pillen, aktiv dunkel ---- */

  background: var(--ink); color: var(--leinwand); box-shadow: none;
}

/* ---- Dashboard als gestapelte Karten ----
   Im Beispiel liegt die Ueberschrift frei auf dem Grund, darunter eine
   grosse Karte und darunter zwei kleine nebeneinander. Genau so hier:
   Datum frei, Hauptkarte mit Tageszahl und Woche, darunter zwei Kacheln. */
.dash { background: none; border: none; box-shadow: none; border-radius: 0; margin: 2px 0 0; }
.dash-kopf { padding: 4px 4px 0; }
.dash-koerper { padding: 8px 0 4px; gap: 9px; }
.dash-haupt {
  background: var(--panel); border-radius: 24px; box-shadow: var(--schatten);
  padding: 15px 18px; gap: 20px; align-items: center; flex-wrap: nowrap;

.tagzahl .gross { font-size: calc(30px * var(--sk)); }
.dash-woche { flex: 1 1 auto; margin: 0; }

.dash-kacheln { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
/* Am Rechner stehen die beiden Kacheln rechts neben der Hauptkarte statt
   darunter — sonst zieht sich jede Kachel ueber die halbe Seite. */
@media (min-width: 721px) {
  /* Eine Reihe: Hauptkarte, dann die zwei Kacheln. Untereinander liessen
     sie unter der Hauptkarte eine tote Flaeche stehen. */
  /* 23.09.2026: Die beiden Kacheln sind je eine Zeile und stehen rechts
     uebereinander in einer schmalen Spalte. */
  .dash-koerper { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 9px; align-items: stretch; }
  .dash-kacheln { display: flex; flex-direction: column; gap: 9px; }
  .kachel { flex: 1 1 0; }
  .dash-haupt { padding: 14px 20px; }
}
/* Die Prozentzahl steht schon in der Bahn — sie wuerde die Kachel nur
   hoeher machen. */
.kachel .anteil { display: none; font-size: calc(11px * var(--sk)); color: var(--grau); margin-top: 5px; }
.kachel .schiene { margin-top: 0; }
/* Eine Zeile: Name, Zahl, Bahn. Die Bahn nimmt den Rest der Breite. */

  display: grid; grid-template-columns: auto auto minmax(24px, 1fr); align-items: center; column-gap: 10px;
  background: var(--panel); border-radius: 16px; box-shadow: var(--schatten);
  padding: 9px 14px; text-align: left; min-width: 0;
}

.kachel .zahl {
  font-family: var(--kopf); font-size: calc(15px * var(--sk)); font-weight: 600;
  letter-spacing: -.01em; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.2; white-space: nowrap;
}
.kachel .zahl .von { font-size: calc(12px * var(--sk)); font-weight: 500; color: var(--grau); }

/* ---- Die Leiste unten, zweigeteilt ----
   Links die Bereiche, rechts als eigener Kreis das Anlegen. */

  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 35; display: flex; align-items: center;

  /* ---- Unten: Leiste und Knopf duerfen sich nicht beruehren ----

   `position: fixed; left: 50%`. Als der Knopf danebengesetzt wurde, blieb
   sie aus dem Fluss — beide sassen zentriert uebereinander. Jetzt traegt
   nur noch die Huelle die Position, die Leiste liegt normal darin. */
  gap: 12px; pointer-events: none;
}
.untenleiste {
  background: var(--glas); border: 1px solid var(--rand-linie); border-radius: 999px;
  box-shadow: 0 16px 34px -18px rgba(18,18,28,.45), 0 2px 6px rgba(18,18,28,.07);
}

.untennav[aria-current="page"] { background: var(--ink); color: var(--leinwand); }
.untennav[aria-current="page"] .wort { display: inline; }
.untenbereich .fab { margin: 0; flex-shrink: 0;
  background: var(--akzent); color: var(--akzent-text);

  box-shadow: 0 16px 34px -18px rgba(18,18,28,.5), 0 2px 6px rgba(18,18,28,.1);

@media (min-width: 721px) { .untenbereich .fab { display: flex; } }

@media (max-width: 720px) {
  .dash-haupt { padding: 13px 15px; gap: 13px; flex-wrap: wrap; }
  .tagzahl .gross { font-size: calc(26px * var(--sk)); }

/* ---- Der Rahmen faded aus, statt eine Kante zu ziehen ---- */
.zeile[data-fokus="naechstes"],
.zeile[data-prio="1"][data-fokus="naechstes"],
.zeile[data-fokus="naechstes"][data-laeuft="ja"],
.zeile[data-prio="1"][data-fokus="naechstes"][data-laeuft="ja"],
.tafel > .zeile[data-fokus="naechstes"]:last-child {
  /* 23.09.2026: nur noch der Rahmen, kein Leuchten drumherum. */
  border-color: color-mix(in srgb, var(--akzent) 70%, transparent);
  box-shadow: var(--schatten);
}
.zeile[data-fokus="naechstes"][data-erledigt="ja"],
.tafel > .zeile[data-fokus="naechstes"][data-erledigt="ja"]:last-child {
  border-color: transparent; box-shadow: var(--schatten);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .laufflag {
    background: var(--ocker-weich); color: var(--ocker);
    border-color: color-mix(in srgb, var(--ocker) 32%, transparent);
  }
}
.punkte li[data-st="laeuft"] { border-left-color: var(--ocker); }

/* ---- Aktive Reiter: im Dunkeln keine weisse Flaeche ---- */
:root[data-theme="dark"] .segmente button[aria-pressed="true"],
:root[data-theme="dark"] .lreiter button[aria-pressed="true"],
:root[data-theme="dark"] .rundknopf[aria-pressed="true"] {
  background: var(--panel2); color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--linie);
}
:root[data-theme="dark"] .untennav[aria-current="page"] { background: var(--panel2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--linie); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .segmente button[aria-pressed="true"],
  :root:not([data-theme="light"]) .lreiter button[aria-pressed="true"],
  :root:not([data-theme="light"]) .rundknopf[aria-pressed="true"] {
    background: var(--panel2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--linie);
  }
  :root:not([data-theme="light"]) .segmente button[aria-pressed="true"] .zahl,
  :root:not([data-theme="light"]) .lreiter button[aria-pressed="true"] .zahl { color: var(--grau); opacity: 1; }
  :root:not([data-theme="light"]) .knopf { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-text); }
  :root:not([data-theme="light"]) .untennav[aria-current="page"] { background: var(--panel2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--linie); }
}
.untenbereich > * { pointer-events: auto; }

/* =====================================================================
   23.09.2026 — Priorität als Streifen, "Als nächstes" als Gruppe
   ===================================================================== */
/* 23.09.2026 (später): Der Streifen ist raus. Die Priorität liegt jetzt als
   weicher Farbschleier von links in der Blase. Wie weit er reicht, wo er
   seinen Schwerpunkt hat und wie kräftig er ist, wird pro Aufgabe aus ihrer
   id gewürfelt — fest pro Aufgabe (sonst flackert es bei jedem Neuzeichnen),
   aber in der Liste nie zweimal gleich. Nur die Zeile, nicht das Blatt. */
.priowash {
  position: absolute; inset: 0; border-radius: inherit; z-index: 0; pointer-events: none;
  --pc: var(--grau);
  background:
    radial-gradient(var(--w) var(--h) at 0% var(--y),
      color-mix(in srgb, var(--pc) calc(var(--a) * var(--wash)), transparent) 0%,
      color-mix(in srgb, var(--pc) calc(var(--a2) * var(--wash)), transparent) 48%,
      transparent 100%),
    linear-gradient(var(--ang),
      color-mix(in srgb, var(--pc) calc(var(--a3) * var(--wash)), transparent) 0%,
      transparent var(--w2));
  transition: opacity .25s ease;
}
.priowash[data-p="1"] { --pc: var(--rot); }
/* Mittel bekommt ein eigenes, klares Gelb: das Signal-Gold ist so bräunlich,
   dass es als Schleier fast wie das Rot aussah (Lukas, 23.09.2026). */
.priowash[data-p="2"] { --pc: #e0a800; }
:root[data-theme="dark"] .priowash[data-p="2"] { --pc: #f0c53a; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .priowash[data-p="2"] { --pc: #f0c53a; }
}
.priowash[data-p="3"] { --pc: var(--grau); }

/* ================= Leiste unten am Handy =================
   Nicht aktive Bereiche: Symbol oben, Name klein darunter — so passt die
   Leiste mit dem runden Knopf auf 375px. */
@media (max-width: 720px) {
  .untennav:not([aria-current="page"]) { flex-direction: column; gap: 1px; padding: 5px 10px 4px; }
  .untennav:not([aria-current="page"]) .wort { font-size: 10px; line-height: 1.1; }
}

/* ================= Handy: Tippflächen und Felder =================
   23.09.2026 (klar-ui). iOS zoomt beim Antippen in jedes Feld unter 16px
   hinein und bleibt dann vergrößert stehen. Die alte Regel dafür verlor gegen
   spätere Klassen-Regeln — gemessen lagen Notiz, Unterpunkt, Suche und
   Auswahlfelder bei 12–13,5px. Hier gewinnt sie sicher.
   Der Haken ist 18px groß, getroffen werden soll er mit dem Daumen: die
   unsichtbare Fläche drumherum macht ihn gut 40px groß. */
@media (hover: none) and (pointer: coarse) {
  html:root :is(input, textarea, select):not([type="checkbox"]):not([type="radio"]),
  html:root .datumfeld { font-size: 16px; }
  .haken { position: relative; }
  .haken::before { content: ""; position: absolute; inset: -11px; }
  .untennav { min-height: 44px; }
}
</style>
</head>

<style id="bewegung-stil">
/* ===== Bewegung (03.10.2026) =====
   Aus der Demo „Klar Bewegung“ übernommen. Klar baut die Liste bei jeder
   Änderung neu; die Übergänge messen deshalb vorher/nachher und gleichen den
   Unterschied aus, statt auf CSS-Transitions zu hoffen. Alles unter 300 ms,
   „Bewegung reduzieren“ schaltet alles ab. */

/* Der Hinweis schwebt unten, statt die Liste nach unten zu schieben. */
#hinweis.hinweiszeile { position: fixed; z-index: 56; left: 50%; transform: translateX(-50%);
  bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: max-content; max-width: min(540px, calc(100vw - 32px)); margin: 0;
  background: var(--ink); color: var(--leinwand); border: none; border-radius: 14px; gap: 12px;
  padding: 10px 10px 10px 16px; min-height: 44px; font-size: calc(13.5px * var(--sk)); line-height: 1.4;
  box-shadow: 0 16px 36px -14px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.08); }
#hinweis.hinweiszeile:not(:has(.zurueckknopf)) { padding-right: 16px; }
#hinweis.hinweiszeile > span { min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#hinweis.hinweiszeile[data-art="fehler"] { background: var(--rot); color: #ffffff; border: none; }
#hinweis .zurueckknopf { color: inherit; background: color-mix(in srgb, currentColor 16%, transparent); border: none; border-radius: 9px; padding: 6px 12px; }
@media (max-width: 720px) {
  #hinweis.hinweiszeile { left: 16px; right: 86px; transform: none; width: auto; max-width: none; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
}

@media (prefers-reduced-motion: no-preference) {
  /* Haken zeichnet sich, federt einmal leicht nach. */
  @keyframes hakenZug { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
  @keyframes hakenPop { 0% { transform: scale(.82); } 55% { transform: scale(1.08); } 100% { transform: none; } }
  @keyframes punktRein { from { transform: scale(0); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes strichRein { from { text-decoration-color: transparent; } }
  .zeile.geht > .z-kopf > .haken svg path,
  .punkte li.frisch[data-st="fertig"] .haken svg path { stroke-dasharray: 24; animation: hakenZug .26s var(--ease-aus) .04s both; }
  .zeile.geht > .z-kopf > .haken,
  .punkte li.frisch[data-st="fertig"] .haken { animation: hakenPop .3s var(--ease-aus); }
  .zeile.geht > .z-kopf > .haken svg { opacity: 1; }
  .zeile.geht .titel { animation: strichRein .36s var(--ease-aus) .1s both; }
  .punkte li.frisch[data-st="fertig"] .punkt-feld, .punkte li.frisch[data-st="fertig"] .pt { animation: strichRein .36s var(--ease-aus) .1s both; }
  /* In Arbeit: der Punkt im Haken springt auf, danach das ruhige Pulsieren. */
  .zeile[data-laeuft="ja"].eben > .z-kopf > .haken::after { animation: punktRein .24s var(--ease-aus), haltbar 3.6s ease-in-out .24s infinite; }
  .punkte li.frisch[data-st="laeuft"] .haken::after { animation: punktRein .24s var(--ease-aus); }
  .punkte li.frisch { transition: none; }
}
/* 03.10.2026: Titel in der Übersicht einzeilig, @Kasten so groß wie der Text */
.at-chip { display: inline !important; padding: 1px 4px !important; margin: 0 !important; border-radius: 5px !important; line-height: inherit !important;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.at-chip i { margin-right: 0 !important; }
</style>
<style id="faeden-stil">
/* ===== Entwurf 29.09.2026: Übersicht, Fäden, Wiedervorlage, Seitenblatt ===== */
:root { --gold-weich: color-mix(in srgb, var(--gold) 15%, var(--panel)); --fschleier: rgba(10,9,16,.38); }

/* Seitenblatt: fährt von rechts über die Liste */

html[data-seite] #inhalt { animation: none !important; transform: none !important; }
#inhalt.wechsel { animation-fill-mode: backwards !important; }

.seitenschicht { position: fixed; inset: 0; z-index: 45; display: flex; justify-content: flex-end; }
.seitenschleier { position: absolute; inset: 0; background: var(--fschleier); }

  background: var(--leinwand); box-shadow: -18px 0 40px -24px rgba(0,0,0,.45);
  padding: env(safe-area-inset-top, 0px) 0 calc(28px + env(safe-area-inset-bottom, 0px)); }
.seitenblatt > .blatt { border: none; border-radius: 0; min-height: 100%; background: var(--panel); }
/* ---- @Name im Titel (03.10.2026): kleiner Kasten in Flieder ---- */
.at-chip { display: inline-block; padding: 0 6px 0 5px; margin: 0 1px; border-radius: 6px; background: var(--akzent-weich);
  color: var(--akzent); font-weight: inherit; line-height: 1.4; white-space: nowrap; vertical-align: baseline;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--akzent) 16%, transparent); }

[data-erledigt="ja"] .at-chip, .g-zeile[data-st="erl"] .at-chip, .fp-zeile[data-erl="ja"] .at-chip { opacity: .7; }
/* ---- Gruppen (02.10.2026) ---- */
.g-pillen { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: -4px; }
.g-pille { display: inline-flex; align-items: center; background: var(--akzent-weich); color: var(--akzent); border-radius: 99px; height: 28px; font-size: calc(12.5px * var(--sk)); font-weight: 500; max-width: 100%; }

.g-pille small { color: var(--ink2); font-weight: 400; font-size: inherit; opacity: .8; }

.g-plus { border: 1px dashed var(--linie); background: none; color: var(--grau); border-radius: 99px; height: 28px; min-width: 28px; padding: 0 11px; font: inherit; font-size: calc(12.5px * var(--sk)); }
.g-wahl { flex-basis: 100%; display: flex; flex-direction: column; gap: 8px; background: var(--panel2); border-radius: 14px; padding: 8px; animation: gWahl .2s var(--ease-aus); }
@keyframes gWahl { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
.g-wahl input { border: 1px solid var(--linie); background: var(--panel); border-radius: 10px; padding: 8px 11px; font: inherit; color: var(--ink); outline: none; }
.g-wahl input:focus { border-color: var(--akzent); }
.g-vorschl { display: flex; flex-wrap: wrap; gap: 6px; }
.g-vorschl:empty { display: none; }
.g-vorschl button { border: 1px solid var(--linie); background: var(--panel); color: var(--ink); border-radius: 99px; padding: 5px 12px; font: inherit; font-size: calc(12.5px * var(--sk)); }
.g-vorschl button small { color: var(--grau); }
.g-vorschl button[data-neu] { border-style: dashed; color: var(--akzent); }
.gseite .koerper { gap: 18px; }
.g-name { width: 100%; font-family: var(--anzeige); font-size: calc(23px * var(--sk)); font-weight: 600; letter-spacing: -.02em; border: 1px solid transparent; background: none; color: var(--ink); padding: 2px 7px; margin-left: -8px; border-radius: 9px; }
.g-name:focus { outline: none; border-color: var(--akzent); background: var(--panel2); }
.g-bezug { display: flex; flex-direction: column; gap: 8px; margin-top: -8px; }
.g-reihe { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.g-lab { width: 108px; flex-shrink: 0; font-size: calc(12px * var(--sk)); color: var(--grau); }
.g-aktionen .g-plus { height: 26px; font-size: calc(12px * var(--sk)); }
.g-plus[aria-pressed="true"] { border-style: solid; border-color: var(--akzent); color: var(--akzent); }

.g-text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.g-chip { display: inline-flex; align-items: center; height: 26px; padding: 0 2px 0 11px; border-radius: 99px; background: var(--panel2); color: var(--ink2); font-size: calc(12.5px * var(--sk)); }

.g-neu { display: flex; align-items: center; gap: 8px; background: var(--panel2); border-radius: 14px; padding: 0 14px; height: 46px; border: 1px solid transparent; }
.g-neu:focus-within { border-color: var(--akzent); background: var(--panel); }

.g-abschnitt h4 span { color: var(--grau); font-weight: 400; font-size: calc(12px * var(--sk)); }
.g-still { margin: 0; color: var(--grau); font-size: calc(13px * var(--sk)); }
.g-liste { display: flex; flex-direction: column; }

.g-liste > .g-zeile:last-child, .g-liste > .g-erw:last-child .g-zeile { border-bottom: none; }
.g-pkt { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--grau); opacity: .7; flex-shrink: 0; }
.g-zeile[data-st="laeuft"] .g-pkt { background: var(--ocker); border-color: var(--ocker); opacity: 1; }
.g-zeile[data-st="erl"] .g-pkt { background: var(--gruen); border-color: var(--gruen); opacity: 1; }
.g-zeile[data-st="erl"] .g-t b { color: var(--ink2); font-weight: 400; }
.g-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.g-t b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-t small { color: var(--grau); font-size: calc(11.5px * var(--sk)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-m { flex-shrink: 0; color: var(--grau); font-size: calc(11.5px * var(--sk)); font-variant-numeric: tabular-nums; }

.g-erw .g-zeile { flex: 1; }
.g-zuordnen { flex-shrink: 0; border: 1px solid var(--linie); background: none; border-radius: 99px; font: inherit; font-size: calc(12px * var(--sk)); color: var(--akzent); padding: 4px 11px; }
.g-tag { font-size: calc(11.5px * var(--sk)); color: var(--grau); font-weight: 600; margin: 10px 0 2px; }
.g-tag:first-of-type { margin-top: 2px; }
.g-ev { display: flex; gap: 10px; padding: 3px 0; font-size: calc(13.5px * var(--sk)); line-height: 1.5; }
.g-uhr { color: var(--grau); font-variant-numeric: tabular-nums; flex-shrink: 0; width: 40px; font-size: calc(12px * var(--sk)); padding-top: 1px; }
.g-was { min-width: 0; overflow-wrap: anywhere; }
.g-von { border: none; background: none; padding: 0; font: inherit; font-weight: 500; color: var(--ink); margin-right: 6px; text-align: left; text-decoration: underline; text-decoration-color: var(--linie); text-underline-offset: 3px; }
.g-ev[data-art="auto"] .g-text { color: var(--grau); }
.g-mehr { border: none; background: none; color: var(--ink2); font: inherit; font-size: calc(12.5px * var(--sk)); padding: 8px 0 0; }
.g-treffer { display: flex; flex-wrap: wrap; gap: 8px; }

.g-treffer button small { color: var(--grau); font-weight: 400; }
.g-ini { width: 26px; height: 26px; border-radius: 50%; background: var(--akzent-weich); color: var(--akzent); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
@media (hover: hover) and (pointer: fine) {
  .g-zeile:hover { background: var(--panel2); }

     im Hintergrund lief, wurde Lukas mitten in der Arbeit zurückgeworfen —
     am Rechner wie am iPhone. Deshalb (09.09.2026):

     - Jede Änderung geht SOFORT in den lokalen Zwischenspeicher. Kein Neuladen,
       nichts geht verloren, auch wenn der Browser abstürzt.
     - Veröffentlicht wird nur an drei Stellen: wenn die Seite in den Hintergrund
       geht (App gewechselt, Tab gewechselt, Bildschirm aus), wenn sie geschlossen
       wird, und wenn Lukas selbst auf Sichern drückt.
     - Während der Arbeit passiert also nie ein Neuladen.

  var offeneAenderung = false, letzteTat = 0;
  var ENTWURF = "ideenbrett.entwurf";

  }
  /* Seit 16.09.2026 gibt es keinen Sichern-Knopf mehr. Jede Änderung geht von
     selbst in den Datenspeicher; der Knopf taucht nur noch als Warnung auf,

    zustand.zuletzt = new Date().toISOString();
    offeneAenderung = true;
    aenderungsNr++;
    letzteTat = Date.now();

    wolkeMerken();
    standAnzeigen();
  }
  function sofortSpeichern() {

      amSpeichern = false;

         Zwischenspeicher bleibt stehen. */

  /* ================= Wolke =================
     Der Grund, warum am 12.09.2026 Fortschritt verlorenging: veroeffentlicht
     wurde nur beim Weglegen der Seite, beim Schliessen und auf Knopfdruck.

       1. Zwischenspeicher im Browser   — sofort, uebersteht Absturz
       2. Wolke (stand/aktuell)         — nach zwei Sekunden Ruhe
       3. Veroeffentlichte Seite        — beim Weglegen und auf Knopfdruck

  /* Entprellt: zwei Sekunden nach dem letzten Handgriff. Waehrend getippt

  var letzteSicherung = 0;

      return wolke.collection(SICHERUNGEN).orderBy("gesichertAm", "desc").limit(40).get();

      weg.forEach(function (d) { wolke.collection(SICHERUNGEN).doc(d.id).delete().catch(function () {}); });

  /* Ein fremder Stand kommt herein. Drei Faelle, und in keinem geht etwas
     verloren: gleiches Geraet (nichts tun), nichts Offenes hier (uebernehmen),
     eigene ungesicherte Arbeit (nicht anfassen, beide sichern, melden). */
  function wolkeHerein(d) {
    if (!d || !d.stand) { return; }
    /* 22.09.2026: Hier stand "vom selben Geraet? dann nichts tun". Genau das hat
       Lukas' Arbeit verschluckt: nach jedem Neuladen kam der gespeicherte Stand

      }, function () { wolke = null; wolkeFehler = true; standAnzeigen(); });

  }

  /* ================= Sicherungen ansehen ================= */

  function sicherungenLaden() {
    if (!wolke) { sicherListe = []; sicherLaedt = false; zeichnen(); return; }
    sicherLaedt = true;
    wolke.collection(SICHERUNGEN).orderBy("gesichertAm", "desc").limit(20).get().then(function (snap) {
      sicherListe = snap.docs.map(function (d) {

    var neu = null;
    try { neu = JSON.parse(s.stand); } catch (e) { neu = null; }
    if (!neu || !Array.isArray(neu.aufgaben)) { hinweisZeigen("Diese Sicherung lässt sich nicht lesen.", "fehler"); return; }
    /* Erst den jetzigen Stand wegschreiben, dann zurueckholen. */
    sicherungSchreiben(standKoerper(), "hier, vor Wiederherstellen");

    zustand.zuletzt = new Date().toISOString();
    sicherKandidat = null; sicherAuf = false; sicherListe = null;

  /* ================= Sicherung als Datei (öffentliche Fassung) ================= */
  var dateiStand = null;

    var inhalt = JSON.stringify({ klar: 1, gesichertAm: d.toISOString(), zustand: zustand }, null, 1);
    try {
      var url = URL.createObjectURL(new Blob([inhalt], { type: "application/json" }));

      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);

  function sicherSeite() {

  /* ================= Cluster ================= */

  function clusterAnlegen(name) {
    var c = String(name || "").trim();

    if (clusterFilter === name) { clusterFilter = "alle"; merken("ideenbrett.cluster", "alle"); }
  }
  function clusterUm(alt, neu) {

  /* ================= Dashboard =================
     Steht ueber der Liste, nicht an ihrer Stelle. Lukas will beim Aufmachen

  function offeneListe() {
    return zustand.aufgaben.filter(function (a) { return a.status !== "erledigt" && !FAD.verborgen(a); });
  }
  function tagwerkPlus(tag, n) {
    if (!tag) { return; }
    var w = (zustand.tagwerk[tag] || 0) + n;
    if (w > 0) { zustand.tagwerk[tag] = w; } else { delete zustand.tagwerk[tag]; }
  }
  function wochenTage() {
    /* Montag bis Sonntag der laufenden Woche. */
    var d = new Date(heuteTag() + "T00:00:00");
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    var raus = [];
    for (var i = 0; i < 7; i++) {
      var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i);
      raus.push(x.getFullYear() + "-" + zz(x.getMonth() + 1) + "-" + zz(x.getDate()));
    }
    return raus;
  }
  function serie() {
    /* Tage am Stueck mit mindestens einer abgehakten Aufgabe. Heute zaehlt
       nur mit, wenn schon was weg ist — sonst reisst die Serie morgens ab,
       obwohl der Tag noch laeuft. */
    var h = heuteTag(), n = 0;
    var start = (zustand.tagwerk[h] || 0) > 0 ? 0 : 1;
    for (var i = start; i < 400; i++) {
      if ((zustand.tagwerk[tagPlus(-i)] || 0) > 0) { n++; } else { break; }
    }
    return n;
  }
  function dashDaten() {
    var h = heuteTag(), offeneA = offeneListe();
    var vorgemerkt = offeneA.filter(function (a) { return a.fokus === "naechstes"; });
    var hFertig = zustand.tagwerk[h] || 0;
    var wTage = wochenTage(), wFertig = 0;
    wTage.forEach(function (t) { wFertig += (zustand.tagwerk[t] || 0); });
    var zaehlung = {};
    offeneA.forEach(function (a) { var k = fristStufe(a); zaehlung[k] = (zaehlung[k] || 0) + 1; });
    var ueber = zaehlung.ueberfaellig || 0;
    return {
      tag: h, offen: offeneA.length,
      nOffen: vorgemerkt.length, hFertig: hFertig, nPensum: hFertig + vorgemerkt.length,
      wFertig: wFertig, wPensum: wFertig + vorgemerkt.length,
      laeuft: offeneA.filter(function (a) { return a.laeuft; }).length,
      frist: zaehlung, ueber: ueber, hoch: offeneA.filter(function (a) { return (a.prio || 2) === 1; }).length,
      erledigt: zustand.aufgaben.length - offeneA.length,
      imTermin: offeneA.length - ueber,
      wTage: wTage, serie: serie()
    };
  }
  function quote(a, b) { return b > 0 ? Math.max(0, Math.min(1, a / b)) : 0; }
  function prozent(a, b) { return b > 0 ? Math.round(quote(a, b) * 100) + "%" : "\u2013"; }

  function ringBogen(radius, anteil, nr, breite) {

  /* ================= Fristzeile =================

  function fristZeile(liste) {

  /* Farbschleier für die Priorität. Die Werte hängen an der id der Aufgabe:

  var SCHLEIER_STAERKE = { 1: [19, 30], 2: [14, 23], 3: [7, 12] };
  /* 23.09.2026: Der Schleier ist fuer alle Aufgaben gleich (Zufall las sich wie

  function prioSchleier(a) {

    function von(x, y) { return x + r() * (y - x); }

  function ideenZeile(e) {

  function innen(x, y) {
    /* Bis 22.09.2026 stand Angefangenes zuoberst. Genau das wollte Lukas nicht:
       eine Aufgabe soll stehen bleiben, wo er sie zuletzt gesehen hat. */
    var nx = tageBis(x.faellig), ny = tageBis(y.faellig);

    if (ny === null) { ny = 99999; }

  /* Welche Aufgaben der gewählte Reiter zeigt. Der Cluster-Filter aus der

  /* Zwei Zustände, mehr nicht: was noch ansteht und was durch ist. Bis zum
     12.09.2026 waren es vier Reiter samt Cluster-Auswahl — Lukas: "die Module
     werden mittlerweile zu viel". Heute und Woche laufen jetzt als Gruppen in
     der offenen Liste und als anklickbare Zeilen im Dashboard. */
  function reiterListe(art) {
    if (art === "erledigt") { return zustand.aufgaben.filter(function (a) { return a.status === "erledigt"; }); }
    if (art === "wv") { return zustand.aufgaben.filter(function (a) { return FAD.verborgen(a); }); }
    return zustand.aufgaben.filter(function (a) { return a.status !== "erledigt" && !FAD.verborgen(a); });
  }
  var SCHNELL = {
    naechstes: { name: "vorgemerkt", pruef: function (a) { return a.fokus === "naechstes"; } },
    laeuft: { name: "angefangen", pruef: function (a) { return !!a.laeuft; } },
    ueberfaellig: { name: "\u00fcberf\u00e4llig", pruef: function (a) { return fristStufe(a) === "ueberfaellig"; } },
    kritisch: { name: "kritisch", pruef: function (a) { return fristStufe(a) === "kritisch"; } },
    hoch: { name: "hohe Priorit\u00e4t", pruef: function (a) { return (a.prio || 2) === 1; } }
  };
  function schnellAn(liste) {
    if (!schnell || !SCHNELL[schnell]) { return liste; }
    return liste.filter(SCHNELL[schnell].pruef);
  }

  /* Gruppiert nach der gewählten Ordnung. Wird für den Rest der Liste
     gebraucht — das Vorgenommene steht davor und ordnet sich selbst. */
  function nachOrdnung(liste) {
    var gruppen = [];
    if (sortierung === "prio") {
      [1, 2, 3].forEach(function (p) {
        var g = liste.filter(function (a) { return (a.prio || 2) === p; });
        if (g.length) { gruppen.push({ name: PRIO[p], liste: g.sort(innen), p: p }); }
      });
    } else if (sortierung === "cluster") {
      var namen = [], gesehen = {};
      liste.forEach(function (a) {
        var c = (a.cluster || "").trim() || "Ohne Cluster";
        if (!gesehen[c]) { gesehen[c] = true; namen.push(c); }
      });
      namen.sort(function (x, y) {
        if (x === "Ohne Cluster") { return 1; }
        if (y === "Ohne Cluster") { return -1; }
        return x.localeCompare(y, "de");
      });
      namen.forEach(function (c) {
        gruppen.push({ name: c, liste: liste.filter(function (a) { return ((a.cluster || "").trim() || "Ohne Cluster") === c; }).sort(innen) });
      });
    } else {
      /* Dieselben fuenf Stufen wie in der Zeile ueber der Liste. */
      FRISTEN.forEach(function (fa) {

        if (g.length) {
          gruppen.push({ name: fa.gruppe, liste: g.sort(innen),

  /* Abgehaktes wird nach dem Tag gruppiert, an dem es vom Tisch war — neueste

  function erledigtTopf(tag) {
    if (!tag) { return { schluessel: "zzz", name: "Ohne Datum", rang: 9 }; }
    var n = tageBis(tag);
    if (n === 0) { return { schluessel: "a", name: "Heute", rang: 0 }; }
    if (n === -1) { return { schluessel: "b", name: "Gestern", rang: 1 }; }
    if (wochenSchluessel(tag) === wochenSchluessel(heuteTag())) {
      return { schluessel: "c" + zz(Math.min(99, Math.abs(n))), name: datumLabel(tag), rang: 2 };
    }
    var d = new Date(tag + "T00:00:00");
    if (isNaN(d)) { return { schluessel: "zzz", name: "Ohne Datum", rang: 9 }; }
    var vorWoche = wochenSchluessel(tagPlus(-7));
    if (wochenSchluessel(tag) === vorWoche) { return { schluessel: "d", name: "Letzte Woche", rang: 3 }; }

    return { schluessel: "e" + (9999 - d.getFullYear()) + "-" + zz(12 - (d.getMonth() + 1)), name: name, rang: 4, mk: mk };

  function erledigtGruppen(liste) {

  function aufgabenListe() {
    var roh = reiterListe(lreiter);

    if (!liste.length) {

  function passt(text, q) { return String(text || "").toLowerCase().indexOf(q) !== -1; }

  function sucheListe() {
    var q = suche.trim().toLowerCase();
    var af = zustand.aufgaben.filter(function (a) {
      if (passt(a.titel, q) || passt(a.notiz, q) || passt(a.cluster, q)) { return true; }
      if ((a.verlauf || []).some(function (v) { return passt(v.text, q); })) { return true; }

        if ((x.prio || 2) !== (y.prio || 2)) { return (x.prio || 2) - (y.prio || 2); }
        return String(y.erstellt).localeCompare(String(x.erstellt));

      af.forEach(function (a) { t.push(aufgabenZeile(a)); });
      t.push("</div></section>");

    if (mf.length) {

      t.push(gruppenKopf("Mitschriften", mf.length, ""));

    return '<div style="display:flex;flex-direction:column;gap:14px">' + t.join("") + "</div>";

  /* ================= Aufgabenblatt ================= */

  var punktWaechst = null;

  }
  /* Ein Schritt, der nie auf der Liste stand: angerufen, nachgehakt, eine

  function zeitpunkt(iso) {
    var d = new Date(iso);
    if (isNaN(d)) { return ""; }
    return WOTAGE[(d.getDay() + 6) % 7] + ", " + zz(d.getDate()) + "." + zz(d.getMonth() + 1) + "."
      + " · " + zz(d.getHours()) + ":" + zz(d.getMinutes());

  var VERLAUF_KURZ = 3;
  function verlaufBlock(a) {

      } else if (verlaufAlle && v.length > VERLAUF_KURZ) {
        t.push('<button type="button" class="v-mehr" data-atu="verlauf-weniger">'

      }
      t.push('<ul class="verlauf">');
      v.forEach(function (x, i) {

        b.push("</div>");
      });

    }

    t.push('<div class="knopfzeile"><button type="button" class="knopf" data-btu="raus">In die Zwischenablage</button></div>');

  function standText() { return JSON.stringify(zustand); }

  function clusterPanel() {
    var t = [], liste = cluster();
    t.push('<div class="kasten"><div class="balken">');
    t.push('<button type="button" class="zurueck" data-ptu="zu"><span aria-hidden="true">←</span> Zurück</button>');

    t.push('<div class="fach"><span class="name">Neuer Cluster</span>');
    t.push('<div class="knopfzeile"><input class="eingabe breit" id="cneu" placeholder="Name, z. B. Kunden" autocomplete="off" aria-label="Neuer Cluster">');
    t.push('<button type="button" class="knopf" data-ctu="anlegen">Anlegen</button></div></div>');
    t.push('<div class="fach"><span class="name">Vorhandene</span>');

      t.push("<p>Noch keine. Leg oben einen an.</p>");
    } else {
      t.push('<ul class="clusterliste">');
      liste.forEach(function (c) {
        var wieviel = zustand.aufgaben.filter(function (a) { return a.cluster === c && a.status !== "erledigt"; }).length;
        t.push('<li data-c="' + esc(c) + '">');
        t.push('<input class="eingabe breit" data-feld="name" value="' + esc(c) + '" aria-label="Name des Clusters">');
        t.push('<span class="wieviel">' + wieviel + (wieviel === 1 ? " Aufgabe" : " Aufgaben") + "</span>");
        if (loeschKandidat === c) {
          t.push('<span class="sicher">Wirklich?</span>');
          t.push('<button type="button" class="knopf-klein weg" data-ctu="wegja">Ja, löschen</button>');
          t.push('<button type="button" class="knopf-klein" data-ctu="wegnein">Abbrechen</button>');
        } else {
          t.push('<button type="button" class="knopf-klein weg" data-ctu="weg">Löschen</button>');
        }
        t.push("</li>");
      });
      t.push("</ul>");
      t.push("<p>Namen lassen sich direkt im Feld ändern, die Aufgaben ziehen mit. Beim Löschen behalten die Aufgaben ihren Text und stehen danach ohne Cluster.</p>");
    }
    t.push("</div></div>");
    return t.join("");
  }

  function lernSeite() {
    var L = zustand.lernen;
    var neuE = L.eingang.filter(function (x) { return x.stand !== "ausgewertet"; });
    var t = [];

    t.push('<div class="kasten"><div class="balken">');
    t.push('<button type="button" class="zurueck" data-ptu="zu"><span aria-hidden="true">\u2190</span> Zur\u00fcck</button>');
    t.push('<span class="lage">Gelernt</span></div></div>');

    t.push('<div class="lernkopf"><h2>Was ich mir abgeschaut habe</h2>');
    var spur = [];
    spur.push(L.ablaeufe.length + (L.ablaeufe.length === 1 ? " Ablauf" : " Abl\u00e4ufe"));
    if (neuE.length) { spur.push(neuE.length + " noch nicht ausgewertet"); }
    if (L.zuletztGelernt) { spur.push("zuletzt " + esc(datumLang(L.zuletztGelernt))); }
    t.push('<span class="spur">' + spur.join(" \u00b7 ") + "</span></div>");

    if (!L.ablaeufe.length && !neuE.length) {
      t.push('<div class="tafel"><div class="leer">Noch nichts. Wenn du eine Aufgabe abhakst, fragt die Seite kurz, wie du sie gel\u00f6st hast \u2014 daraus wird hier mit der Zeit eine Sammlung deiner Abl\u00e4ufe.</div></div>');
      return '<div style="display:flex;flex-direction:column;gap:14px">' + t.join("") + "</div>";
    }

    t.push('<div class="gruppen">');

    if (L.ablaeufe.length) {
      t.push(gruppenKopf("Erkannte Abl\u00e4ufe", L.ablaeufe.length, ""));
      L.ablaeufe.slice().sort(function (x, y) {
        return (y.faelle || []).length - (x.faelle || []).length;
      }).forEach(function (b) {
        t.push('<div class="ablauf" data-ablauf="' + esc(b.id) + '">');
        t.push('<div class="ablauf-kopf"><span class="name">' + esc(b.name || "") + "</span>");
        var wieOft = (b.faelle || []).length;
        t.push('<span class="wie-oft">' + wieOft + (wieOft === 1 ? "\u00d7 gesehen" : "\u00d7 gesehen") + "</span>");
        t.push('<span class="werkzeuge">');
        if (b.skill && b.skill.name) {
          t.push('<span class="skillmarke" data-stand="' + esc(b.skill.stand || "vorgeschlagen") + '">'
            + (b.skill.stand === "gespeichert" ? "Skill" : "Skill vorgeschlagen") + "</span>");
        }
        if (schreiben) {
          t.push('<button type="button" class="knopf-klein" data-ltu="einwand" style="color:var(--akzent)">Stimmt nicht ganz</button>');
        }
        t.push("</span></div>");
        if (b.wann) { t.push('<p class="wann">' + esc(b.wann) + "</p>"); }
        if (Array.isArray(b.schritte) && b.schritte.length) {
          t.push("<ol>");
          b.schritte.forEach(function (x) { t.push("<li>" + esc(x) + "</li>"); });
          t.push("</ol>");
        }
        (b.hinweise || []).forEach(function (h) { t.push('<p class="merke">\u00b7 ' + esc(h) + "</p>"); });
        if (b.einwand) { t.push('<p class="merke" style="color:var(--akzent)">Dein Einwand: ' + esc(b.einwand) + "</p>"); }
        if (lernRueck === b.id) {
          t.push('<div class="feldzeile" style="margin-top:6px">');
          t.push('<textarea class="notizfeld" id="einwandfeld" style="min-height:70px" placeholder="Was stimmt nicht?" aria-label="Einwand"></textarea>');
          t.push('<button type="button" class="mikro" id="einwandmikro" data-an="nein" aria-label="Diktieren">' + MIKRO + "</button></div>");
          t.push('<div class="fuss"><button type="button" class="knopf" data-ltu="einwand-ab">Zur\u00fcckgeben</button>');
          t.push('<button type="button" class="knopf-klein" data-ltu="einwand-nein">Abbrechen</button></div>');
        }
        t.push("</div>");
      });
      t.push("</div></section>");
    }

    if (neuE.length) {
      t.push(gruppenKopf("Noch nicht ausgewertet", neuE.length, ' data-eilig="ja"'));
      neuE.slice().reverse().forEach(function (x) {
        t.push('<div class="eingangzeile" data-eingang="' + esc(x.id) + '">');
        t.push('<div class="oben"><span class="was">' + esc(x.titel || "Ohne Titel") + "</span>");
        t.push('<span class="wann">' + esc(datumLang(x.am)) + "</span></div>");
        t.push('<span class="text">' + esc(x.text || "") + "</span>");
        t.push("</div>");
      });
      t.push("</div></section>");
    }

    t.push("</div>");
    return '<div style="display:flex;flex-direction:column;gap:14px">' + t.join("") + "</div>";
  }

  /* ================= Mitschriften =================
     Der Ort für Termine, in denen Lukas etwas lernt — Wochenmeeting, Göttingen,
     Göttingen–Hannover. Kundentermine gehören hier NICHT rein, die laufen
     weiter über OneNote. Geschrieben wird in einem Feld am Stück; hinterher
     bekommt jede Zeile auf Tippen ein Zeichen. Was daraus wird, entscheidet
     Lukas: aus Vorschlägen werden erst Aufgaben, wenn er einzeln freigibt. */

  function findeVorschlag(id) {
    for (var i = 0; i < zustand.vorschlaege.length; i++) {
      if (zustand.vorschlaege[i].id === id) { return zustand.vorschlaege[i]; }
    }
    return null;
  }
  function findeNotiz(id) {
    for (var i = 0; i < zustand.mitschriften.length; i++) {
      if (zustand.mitschriften[i].id === id) { return zustand.mitschriften[i]; }
    }
    return null;
  }
  function reihen() {
    return zustand.reihen.slice().sort(function (x, y) { return x.localeCompare(y, "de"); });
  }
  function reiheAnlegen(name) {
    var c = String(name || "").trim();
    if (!c) { return null; }
    var da = null;
    zustand.reihen.forEach(function (x) { if (x.toLowerCase() === c.toLowerCase()) { da = x; } });
    if (da) { return da; }
    zustand.reihen.push(c);
    return c;
  }
  function reihenWahl(id, wert, feld) {
    var t = ['<select class="eingabe"' + (id ? ' id="' + id + '"' : "") + ' data-feld="' + feld + '" aria-label="Reihe">'];
    t.push('<option value="">ohne Reihe</option>');
    reihen().forEach(function (c) {
      t.push('<option value="' + esc(c) + '"' + (c === wert ? " selected" : "") + ">" + esc(c) + "</option>");
    });
    t.push('<option value="__neu__">＋ Reihen verwalten …</option>');
    t.push("</select>");
    return t.join("");
  }
  function mtext(m) {
    return (m.zeilen || []).map(function (z) { return z.t; }).join("\n");
  }
  /* Marken hängen am Zeilentext, nicht an der Zeilennummer: schiebt sich beim
     Nachtippen alles um zwei Zeilen, bleibt das Zeichen trotzdem an seinem Satz. */
  function mzeilenSetzen(m, text) {
    var alt = {};
    (m.zeilen || []).forEach(function (z) {
      var k = z.t.trim();
      if (k && z.m && alt[k] === undefined) { alt[k] = z.m; }
    });
    m.zeilen = String(text == null ? "" : text).split(/\r?\n/).map(function (t) {
      var k = t.trim();
      return { t: t, m: (k && alt[k]) ? alt[k] : "" };
    });
  }
  function mZahl(m, art) {
    var n = 0;
    (m.zeilen || []).forEach(function (z) { if (z.m === art) { n++; } });
    return n;
  }
  function mLeer(m) {
    return !(m.zeilen || []).some(function (z) { return z.t.trim(); });
  }
  function wartende() {
    return zustand.vorschlaege.filter(function (v) { return v.stand === "wartet"; });
  }
  function notizDatum(m) { return m.am || (m.erstellt ? String(m.erstellt).slice(0, 10) : ""); }

  function mitschriftZeile(m) {
    var todos = mZahl(m, "todo"), durch = !!m.verarbeitetAm;
    var t = [];
    t.push('<button type="button" class="mzeile" data-notizid="' + esc(m.id) + '">');
    t.push('<span class="mz-tag">' + esc(kurzDatum(notizDatum(m)) || "") + "</span>");
    t.push('<span class="mz-titel">' + esc(m.titel || "Ohne Titel") + "</span>");
    t.push('<span class="mz-meta">');
    if (todos) { t.push('<span class="mz-zahl" title="' + todos + ' als Aufgabe markiert">' + todos + "×</span>"); }
    t.push('<span class="mz-stand" data-durch="' + (durch ? "ja" : "nein") + '">' + (durch ? "durch" : (mLeer(m) ? "leer" : "roh")) + "</span>");
    t.push("</span></button>");
    return t.join("");
  }

  function mitschriftenListe() {
    var liste = zustand.mitschriften.filter(function (m) {
      if (reihenFilter === "alle") { return true; }
      return ((m.reihe || "").trim() || "—") === reihenFilter;
    });
    var kopf = [];
    var w = wartende();
    if (w.length) {
      kopf.push('<button type="button" class="vbalken" data-ntu="vorschlaege">');
      kopf.push('<span class="pkt" aria-hidden="true"></span>');
      kopf.push("<span>" + w.length + (w.length === 1 ? " Vorschlag wartet auf dich" : " Vorschläge warten auf dich") + "</span>");
      kopf.push('<span class="leiser">durchgehen →</span></button>');
    }
    if (!liste.length) {
      var leer = zustand.mitschriften.length
        ? "In dieser Reihe steht noch nichts."
        : "Noch keine Mitschrift. Oben rechts auf Neue Mitschrift — dann einfach runterschreiben, was im Termin passiert.";
      return '<div style="display:flex;flex-direction:column;gap:10px">' + kopf.join("")
        + '<div class="tafel"><div class="leer">' + leer + "</div></div></div>";
    }
    var namen = [], gesehen = {};
    liste.forEach(function (m) {
      var r = (m.reihe || "").trim() || "Ohne Reihe";
      if (!gesehen[r]) { gesehen[r] = true; namen.push(r); }
    });
    namen.sort(function (x, y) {
      if (x === "Ohne Reihe") { return 1; }
      if (y === "Ohne Reihe") { return -1; }
      return x.localeCompare(y, "de");
    });
    var t = ['<div class="gruppen">'];
    namen.forEach(function (r) {
      var g = liste.filter(function (m) { return ((m.reihe || "").trim() || "Ohne Reihe") === r; });
      g.sort(function (x, y) { return String(notizDatum(y)).localeCompare(String(notizDatum(x))); });
      t.push(gruppenKopf(r, g.length, ""));
      g.forEach(function (m) { t.push(mitschriftZeile(m)); });
      t.push("</div></section>");
    });
    t.push("</div>");
    return '<div style="display:flex;flex-direction:column;gap:10px">' + kopf.join("") + t.join("") + "</div>";
  }

  /* Gelernt und Fragen sind dieselbe Sammlung aus zwei Blickwinkeln: was aus
     den Terminen hängengeblieben ist, quer über alle Termine. */
  function sammlung(feld) {
    var raus = [];
    zustand.mitschriften.forEach(function (m) {
      (m[feld] || []).forEach(function (x) {
        raus.push({ text: x, titel: m.titel || "Ohne Titel", reihe: m.reihe, am: notizDatum(m), id: m.id });
      });
    });
    raus.sort(function (x, y) { return String(y.am).localeCompare(String(x.am)); });
    return raus;
  }
  function sammlungListe(feld) {
    var xs = sammlung(feld);
    var wasLeer = feld === "gelernt"
      ? "Noch nichts. Beim Sonntagslauf ziehe ich aus deinen Mitschriften raus, was fachlich hängenbleiben soll."
      : "Noch nichts offen. Was in einem Termin unklar blieb, sammelt sich hier — damit du es beim nächsten Mal ansprichst.";
    if (!xs.length) { return '<div class="tafel"><div class="leer">' + wasLeer + "</div></div>"; }
    var t = ['<div class="gruppen">'];
    t.push(gruppenKopf(feld === "gelernt" ? "Was hängengeblieben ist" : "Noch offen", xs.length, feld === "fragen" ? ' data-eilig="ja"' : ""));
    xs.forEach(function (x) {
      t.push('<button type="button" class="eingangzeile" data-notizid="' + esc(x.id) + '" style="width:100%;text-align:left;background:none;font:inherit;color:inherit">');
      t.push('<div class="oben"><span class="was">' + esc(x.titel) + "</span>");
      if (x.reihe) { t.push('<span class="mk-cluster">' + esc(x.reihe) + "</span>"); }
      t.push('<span class="wann">' + esc(kurzDatum(x.am) || "") + "</span></div>");
      t.push('<span class="text">' + esc(x.text) + "</span></button>");
    });
    t.push("</div></section></div>");
    return t.join("");
  }

  function fazitKasten(m) {
    var t = [];
    if (!m.zusammenfassung && !(m.gelernt || []).length && !(m.fragen || []).length) {
      t.push('<div class="mnoch">Noch nicht durchgegangen. Sonntagabend gehe ich die neuen Mitschriften durch, schreibe hier eine kurze Fassung rein und lege dir die Aufgaben daraus zur Freigabe hin.</div>');
      return t.join("");
    }
    t.push('<div class="mfazit"><span class="name">Kurzfassung'
      + (m.verarbeitetAm ? " · " + esc(datumLang(m.verarbeitetAm)) : "") + "</span>");
    if (m.zusammenfassung) { t.push('<p class="kurz">' + esc(m.zusammenfassung) + "</p>"); }
    if ((m.gelernt || []).length) {
      t.push('<div class="mfazit-fach"><span class="name">Hängengeblieben</span><ul class="mliste">');
      m.gelernt.forEach(function (x) { t.push("<li><span>" + esc(x) + "</span></li>"); });
      t.push("</ul></div>");
    }
    if ((m.fragen || []).length) {
      t.push('<div class="mfazit-fach"><span class="name">Noch offen</span><ul class="mliste" data-art="fragen">');
      m.fragen.forEach(function (x) { t.push("<li><span>" + esc(x) + "</span></li>"); });
      t.push("</ul></div>");
    }
    t.push("</div>");
    return t.join("");
  }

  function notizBlatt(m) {
    var t = [];
    var meine = zustand.vorschlaege.filter(function (v) { return v.quelle === m.id && v.stand === "wartet"; });
    t.push('<div class="blatt" data-notiz="' + esc(m.id) + '" data-id="' + esc(m.id) + '">');
    t.push('<div class="balken">');
    t.push('<button type="button" class="zurueck" data-ntu="zu"><span aria-hidden="true">←</span> Zurück</button>');
    t.push('<span class="lage">' + (m.verarbeitetAm ? "durchgegangen" : "roh") + "</span>");
    t.push('<span class="werkzeuge">');
    t.push('<button type="button" class="' + (mschreib ? "knopf" : "knopf-leise") + '" data-ntu="modus">'
      + (mschreib ? "Fertig geschrieben" : "Weiterschreiben") + "</button>");
    t.push("</span></div>");
    t.push('<div class="koerper">');
    t.push('<textarea class="b-titel" data-feld="mtitel" rows="1" aria-label="Worum ging es?" placeholder="Worum ging es?">' + esc(m.titel || "") + "</textarea>");

    t.push('<div class="raster">');
    t.push('<div class="feld"><span class="name">Reihe</span>' + reihenWahl("", m.reihe || "", "mreihe") + "</div>");
    t.push('<div class="feld"><span class="name">Wann</span>');
    t.push(datumKnopf(notizDatum(m), "datumfeld", ' data-kal-ziel="notiz"'));
    t.push("</div></div>");

    if (meine.length) {
      t.push('<button type="button" class="vbalken" data-ntu="vorschlaege">');
      t.push('<span class="pkt" aria-hidden="true"></span>');
      t.push("<span>" + meine.length + (meine.length === 1 ? " Vorschlag aus diesem Termin" : " Vorschläge aus diesem Termin") + "</span>");
      t.push('<span class="leiser">durchgehen →</span></button>');
    }
    t.push(fazitKasten(m));

    t.push('<div class="mblock"><div class="mblock-kopf"><span class="name">Mitschrift</span>');
    t.push('<span class="werkzeuge">');
    if (!mschreib) {
      t.push('<span class="m-hilfe">Zeile antippen: ☐ Aufgabe · ! wichtig · ? Frage</span>');
      t.push('<span class="m-hilfe kurzhilfe">antippen markiert</span>');
    }
    t.push("</span></div>");
    if (mschreib) {
      t.push('<textarea class="mfeld" id="mfeld" data-feld="mtext" placeholder="Einfach runterschreiben, wie im Block. Eine Zeile pro Gedanke — hinterher markierst du, was davon eine Aufgabe ist." aria-label="Mitschrift">' + esc(mtext(m)) + "</textarea>");
    } else if (mLeer(m)) {
      t.push('<div class="leer">Noch nichts geschrieben. Oben auf Weiterschreiben.</div>');
    } else {
      t.push('<ul class="mzeilen">');
      (m.zeilen || []).forEach(function (z, i) {
        var leer = !z.t.trim();

  var letzteSeite = null;
  function zeichnen() {
    var e = offen ? finde(offen) : null;

      || modus === "lagebericht" || modus === "aufgaben" || modus === "start" || modus === "zeitstrahl" || himmelModus();

    if (himmelModus()) { return; }
    /* Am Handy steht die Listensteuerung im Kopf, am Rechner ueber der Liste.
       Beides derselbe Code, nur ein anderer Platz. */
    kopfleisteZeichnen(!imDetail && !suche.trim() && modus === "aufgaben" && schmal());

    /* 29.09.2026 (Entwurf): Das Blatt fährt von rechts über die Liste, statt sie zu ersetzen. */
    var dd = null, basis = "";
    if (modus === "start") { basis = FAD.uebersicht(); }

    }
    var neuSeite = !!a && letzteSeite !== a.id;

    /* 02.10.2026: Das Blatt wird bei jeder Änderung neu gebaut und stand dann
       wieder oben. Scrollstand und Eingabefeld vorher merken, danach setzen. */
    var gGleich = !a && !!GRP && GRP.offen() && GRP.gleich(), warG = !!GRP && GRP.warGezeigt();
    var sbAlt = (a && !neuSeite && !warG) || gGleich ? inhalt.querySelector(".seitenblatt") : null;
    var gHtml = "";
    if (GRP) { if (!a && GRP.offen()) { gHtml = GRP.blattHtml(); } else { GRP.verdeckt(); } }
    var sbY = sbAlt ? sbAlt.scrollTop : 0, winY = window.scrollY || 0;

      + '<aside class="seitenblatt" role="dialog" aria-modal="true" aria-label="Aufgabe">' + blatt(a) + "</aside></div>" : "") + gHtml;
    document.documentElement.toggleAttribute("data-seite", !!a || FAD.mOffen() || !!gHtml);
    document.documentElement.setAttribute("data-modus", modus);
    if (a) { punktMikros(); verlaufMikro(); hoehenAnpassen(); }
    if (sbAlt) {

const GR={'erledigt':'durch','punkt-fertig':'fertig','punkt-an':'bewegt','angefangen':'bewegt','vorgenommen':'bewegt','notiz':'notiz','wiederauf':'wieder','angelegt':'neu','punkt-neu':'neu','punkt-weg':'neu'};

// offene Aufgaben über die Zeit
const wechsel=[];T.forEach(k=>{wechsel.push([k.em,1]);if(k.s==='erledigt'&&k.xm)wechsel.push([k.xm,-1])});

// Zustand
let cv0,cv1,tv0,tv1,raf=null,letzterKey='',hoverT=null;
let Q='',HIT=null,TERMS=[],MHIT=[];
const aus=e=>HIT&&!HIT.has(e.task.id)?' aus':'';
const svg=document.getElementById('svg'),tipp=document.getElementById('tipp'),box=document.getElementById('strahl');

function clamp(a,b){let s=Math.min(Math.max(b-a,MINS),MAXS);let m=(a+b)/2;a=m-s/2;b=m+s/2;if(a<DMIN){b+=DMIN-a;a=DMIN}if(b>DMAX){a-=b-DMAX;b=DMAX}return [a,b]}

// ---------- Zeitstrahl ----------
function zeichnen(){

function fenster(a,b){

function fortHtml(k){const [n,f,an]=k.pk;if(!n)return '';let s='';for(let i=0;i<Math.min(n,10);i++)s+=`<i class="${i<f?'f':i<f+an?'a':''}"></i>`;return `<span class="fort" title="${f} von ${n} Unterpunkten fertig">${s}</span>`}

function woche(a,b,f){

    .sort((x,y)=>(y.bew-x.bew)||(x.k.p-y.k.p)||(y.ruht-x.ruht));
  const zeileO=o=>{const k=o.k;const fa=k.f&&P(k.f)+DAY<=f.ende;
    const meta=[fortHtml(k),fa?`<span class="rot">fällig ${dnum(P(k.f))}.${dte(P(k.f)).getUTCMonth()+1}.</span>`:'',o.bew?'':`${o.ruht} T`,k.fo?'<span class="stern" title="vorgemerkt">★</span>':''].filter(Boolean).join('');

function grob(a,b){

    const e=m+7*DAY;const f=fenster(m,e);if(!f.ev.length&&!f.durch.length)continue;

      mini+=`<i style="height:${Math.max(2,n/MAXTAG*18)}px" title="${TK[d]}: ${n}"><b style="height:${n?g/n*100:0}%"></b></i>`}
    const tit=f.durch.slice(0,3).map(k=>k.t).join(' · ')+(f.durch.length>3?` · +${f.durch.length-3}`:'');
    const id=`${dte(m+3*DAY).getUTCFullYear()}-W${kw(m)}`;const satz=(D.auf[id]||[])[0];

      <span class="inhalt"><span class="zahl"><em class="g">${f.durch.length}</em>abgehakt · <em class="o">${f.bewegtIds.size}</em>in Bewegung · <em>${neu}</em>neu${gl?` · <em style="color:var(--gold)">${gl}</em>in den Baum`:''}</span>

}

function tag(a,b,f){

/* Kürzel und Langform finden sich gegenseitig. Annahme, von Lukas zu ergänzen. */
const SYN=[['phv','haftpflicht','privathaftpflicht'],['hr','hausrat'],['kfz','auto','autoversicherung'],
  ['av','altersvorsorge','rente'],['bav','betriebsrente'],['bkv','betriebliche krankenversicherung'],
  ['bu','berufsunfahigkeit'],['ptg','pflegetagegeld','pflege'],['ktg','krankentagegeld'],
  ['kv','krankenversicherung','krankenzusatz','zahnzusatz'],['rs','rechtsschutz'],['pw','professional works'],
  ['sterbegeld','sterbegeldversicherung']];
const norm=s=>String(s||'').toLowerCase().replace(/ß/g,'ss').replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u')
  .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u');
const woerter=s=>norm(s).split(/[^a-z0-9]+/).filter(Boolean);
const SYNN=SYN.map(g=>g.map(w=>woerter(w).join(' ')));
function begriffe(q){
  return woerter(q).map(t=>{const alts=new Set([t]);
    SYNN.forEach(g=>{if(g.some(w=>w===t||(t.length>=3&&w.startsWith(t))))g.forEach(w=>alts.add(w))});
    return [...alts]});
}
function passt(text,alts){
  const w=woerter(text);if(!w.length)return false;const j=' '+w.join(' ');
  return alts.some(a=>a.length<=3?j.includes(' '+a):j.includes(a));
}
function markiere(text,terms){
  let h=esc(text);if(!terms.length)return h;
  const muster=[...new Set(terms.flat())].filter(Boolean).sort((a,b)=>b.length-a.length).map(a=>{
    let r='';for(const c of a){r+=c==='a'?'(?:a|ä|ae)':c==='o'?'(?:o|ö|oe)':c==='u'?'(?:u|ü|ue)':c==='s'?'(?:s|ß)':c===' '?'[^\\p{L}\\p{N}]+':c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
    return a.length<=3?'(?<![\\p{L}\\p{N}])'+r:r});
  try{const re=new RegExp('('+muster.join('|')+')','giu');
    return h.split(/(<[^>]*>|&[a-z]+;)/).map((teil,i)=>i%2?teil:teil.replace(re,'<mark>$1</mark>')).join('')}catch(e){return h}
}
const NOTIZEN={};E.forEach(e=>{if(e.k==='notiz')(NOTIZEN[e.task.id]=NOTIZEN[e.task.id]||[]).push(e.x)});
function felder(k){
  const f=[{wo:'Titel',t:k.t}];const q=k.q||{};
  if(q.no)f.push({wo:'Notiz',t:q.no});
  (q.pu||[]).forEach(p=>f.push({wo:'Unterpunkt',t:p}));
  (q.lo||[]).forEach(l=>f.push({wo:'Lösungsweg',t:l.t,p:l.p}));
  (NOTIZEN[k.id]||[]).forEach(n=>f.push({wo:'Notiz im Verlauf',t:n}));
  return f;
}
function eventText(e){return e.k==='notiz'||e.k.startsWith('punkt')?e.x:e.task.t}
function suchen(q,leise){
  Q=q.trim();TERMS=begriffe(Q);
  E.forEach(e=>e.direkt=false);
  if(!TERMS.length){HIT=null;MHIT=[]}
  else{
    HIT=new Map();
    T.forEach(k=>{const F=felder(k);
      if(!TERMS.every(alts=>F.some(f=>passt(f.t,alts))))return;
      const fund=F.filter(f=>TERMS.some(alts=>passt(f.t,alts)));
      const L=E.filter(e=>e.task===k);
      L.forEach(e=>{e.direkt=TERMS.some(alts=>passt(eventText(e),alts))});
      const dir=L.filter(e=>e.direkt);
      const letzt=(dir.length?dir:L)[(dir.length?dir:L).length-1]||null;
      HIT.set(k.id,{k,fund,letzt,tm:letzt?letzt.tm:k.em})});
    MHIT=(D.mitschr||[]).map(m=>{const F=[{wo:'Titel',t:m.t},{wo:'Reihe',t:m.r},{wo:'Zusammenfassung',t:m.zf},...m.zl.map(z=>({wo:'Zeile',t:z}))].filter(f=>f.t);
      if(!TERMS.every(alts=>F.some(f=>passt(f.t,alts))))return null;
      return {m,tm:P(m.am),fund:F.filter(f=>TERMS.some(alts=>passt(f.t,alts)))}}).filter(Boolean).sort((a,b)=>b.tm-a.tm);
  }
  if(window.sucheMerken)window.sucheMerken(Q);
  const n=HIT?HIT.size+MHIT.length:0;
  setT('treffer',HIT?(n===1?'1 Treffer':n+' Treffer'):'');
  document.getElementById('suchweg').hidden=!Q;
  document.getElementById('suche').classList.toggle('aktiv',!!HIT);
  document.getElementById('hilfe').textContent=HIT?'Treffer leuchten, der Rest tritt zurück':'Ziehen verschiebt · Scrollen zoomt · Tag anklicken geht rein';
  const det=document.getElementById('detail');det.classList.toggle('leise',!!leise);
  letzterKey='';zeichnen();ruhe();
  if(!HIT)document.getElementById('hilfe').textContent=stufe(tv1-tv0)==='tag'?'Ziehen verschiebt · Scrollen zoomt raus':'Ziehen verschiebt · Scrollen zoomt · '+(stufe(tv1-tv0)==='alles'?'Woche anklicken geht rein':'Tag anklicken geht rein');
}
function wann(tm){
  const t=Math.round((floorDay(STAND)-floorDay(tm))/DAY);
  if(t<=0)return 'heute';if(t===1)return 'gestern';if(t<7)return 'vor '+t+' Tagen';

  inhalt.addEventListener("change", function (ev) { if (FAD.mBildGewaehlt(ev)) { ev.stopImmediatePropagation(); } }, true);
  inhalt.addEventListener("focusout", function (ev) { FAD.mTnBlur(ev); }, true);
  inhalt.addEventListener("mousedown", function (ev) { if (ev.target.closest && ev.target.closest(".m-leiste button")) { ev.preventDefault(); } }, true);
  document.addEventListener("selectionchange", function () { if (FAD.mOffen()) { FAD.edZustand(); } });
  inhalt.addEventListener("submit", function (ev) { if (ev.target.id === "schnellneu") { ev.preventDefault(); FAD.schnellAnlegen(); } }, true);
  inhalt.addEventListener("keydown", function (ev) {
    if (ev.target.id === "schnellfeld" && ev.key === "Enter") { ev.preventDefault(); ev.stopImmediatePropagation(); FAD.schnellAnlegen(); }
    if (ev.target.id === "zsuchfeld") { ev.stopImmediatePropagation(); }
    if (ev.target.closest && ev.target.closest(".mbox")) { ev.stopImmediatePropagation(); FAD.mTaste(ev); return; }
    if (ev.target.id === "linsefeld") {
      ev.stopImmediatePropagation();
      if (ev.key === "Escape") { if (ev.target.value) { ev.target.value = ""; ev.target.dispatchEvent(new Event("input", { bubbles: true })); } else if (FAD.zoomAktiv()) { FAD.linseWeg("zeit"); } }
      if (ev.key === "Backspace" && !ev.target.value && FAD.zoomAktiv()) { ev.preventDefault(); FAD.linseWeg("zeit"); var nf = document.getElementById("linsefeld"); if (nf) { nf.focus(); } }
    }
  }, true);

  wolkeAnmelden();
  himmelAnmelden();
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (ns) {
      schreiben = ns; bereitGeprueft = true; zeichnen(); ansichtHerstellen(rueck);
      if (!ns) { hinweisZeigen("Nur-Lesen-Ansicht: hier lässt sich nichts speichern."); standVergessen(); return; }
      try {
        var ent = localStorage.getItem(ENTWURF);
        if (ent) {
          var entZ = null;
          try { entZ = (JSON.parse(ent) || {}).zuletzt || null; } catch (e2) {}
          /* Nur ein Entwurf, der neuer ist als der geladene Stand, ist echte offene Arbeit. */
          if (entZ && entZ > (zustand.zuletzt || "")) {
            offeneAenderung = true; letzteTat = 0; wolkeJetzt(); standAnzeigen();
          } else { standVergessen(); }
        }
      } catch (e) {}
    }).catch(function () { bereitGeprueft = true; zeichnen(); ansichtHerstellen(rueck); });
  } else if (LOKAL) {
    schreiben = { lokal: true };
    bereitGeprueft = true; zeichnen(); ansichtHerstellen(rueck);
    /* Browser dürfen den Speicher einer Seite sonst bei Platzmangel oder nach
       längerer Pause (Safari) leeren. */
    try { if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); } } catch (e) {}
    try {
      if (!localStorage.getItem("klar.begruesst")) {
        localStorage.setItem("klar.begruesst", "ja");
        hinweisZeigen("Deine Aufgaben bleiben in diesem Browser auf diesem Gerät. Unter Sicherungen im Menü kannst du sie als Datei sichern.");
      }
    } catch (e) {}
  } else {
    bereitGeprueft = true; zeichnen();
    hinweisZeigen("Nur-Lesen-Ansicht: hier lässt sich nichts speichern.");
  }
})();
